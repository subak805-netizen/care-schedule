    const workDays=cnt.D+cnt.E+cnt.S+cnt.N;
    const offCls=offTarget===undefined?'':(cnt.OFF===offTarget?'good':'bad');
    const capT={D:rc.dCap,E:rc.eCap,N:rc.nCap};
    html+=ORD().map(c=>`<td class="sum ${capT[c]&&cnt[c]>capT[c]&&!p.fix?'bad':''}" ${capT[c]?`title="1인당 기본 ${capT[c]}개"`:''}>${cnt[c]}</td>`).join('')+`
      <td class="sum ${offCls}" title="목표 오프수 ${offTarget??'-'}개">${cnt.OFF}${offTarget!==undefined?'/'+offTarget:''}</td>
      <td class="sum">${cnt.V||''}</td><td class="sum">${workDays}</td></tr>`;
  }
  html+=`</tbody><tfoot>`;
  const dayCount=(d,fn)=>{let c=0;for(const p of people){const v=getCell(ym,p.id,d);if(fn(v))c++;}return c;};
  /* 근무인원 합계 줄 */
  html+=`<tr><td class="namecol">근무인원</td>`;
  for(let d=1;d<=nd;d++)html+=`<td>${dayCount(d,v=>v==='D'||v==='E'||v==='S'||v==='N')}</td>`;
  html+=`<td colspan="7"></td></tr>`;
  /* 근무별 합계: D·E·N은 고정 인원 기준 색 표시, S는 남는 인력 자리라 기준 없음 — 평소보다 많은 날만 노랑 */
  let sMin=Infinity;
  for(let d=1;d<=nd;d++)sMin=Math.min(sMin,dayCount(d,v=>v==='S'));
  for(const code of ORD()){
    const flex=code==='S';
    const need=unit.need[code]||0;
    html+=`<tr><td class="namecol">${code} 합계${flex?'':` (기준 ${need})`}</td>`;
    for(let d=1;d<=nd;d++){
      const c=dayCount(d,v=>v===code);
      const cls=flex?(c>sMin?'over':''):(c<need?'under':c>need?'over':'');
      html+=`<td class="${cls}">${c}</td>`;
    }
    html+=`<td colspan="7"></td></tr>`;
  }
  for(const [label,fn] of [['OFF 합계',v=>v==='OFF'],['연차 합계',v=>v==='V']]){
    html+=`<tr><td class="namecol">${label}</td>`;
    for(let d=1;d<=nd;d++){const c=dayCount(d,fn);html+=`<td>${c||''}</td>`;}
    html+=`<td colspan="7"></td></tr>`;
  }
  html+=`</tfoot></table></div>`;
  html+=`<div class="legend">
    ${[...ORD(),'OFF','V'].map(c=>`<span><i style="background:var(--c-${c})"></i>${c==='V'?'연차':c}</span>`).join('')}
    <span>아래 합계: 빨강=필요인원 미달, 주황=초과</span>
  </div>`;
  html+=`<div class="legend"><span style="text-decoration:underline dotted 2px">점선 밑줄</span> = 미리 정한 날 <span style="color:var(--warn);font-weight:700">빨간 테두리</span> = 규칙에 걸린 칸</div>`;
  /* 편성 결과 + 규칙 검사 (우선순위 순) */
  {
    const info=ruleInfo(rc,unit), prio=prioOf(rc), li=prio.indexOf('LINE');
    const filled=people.some(p=>Object.keys((S.roster[ym]||{})[p.id]||{}).some(d=>getCell(ym,p.id,+d)&&getCell(ym,p.id,+d)!=='V'));
    html+=`<h3 style="margin-top:18px">편성 결과</h3>`;
    if(genResult&&genResult.error)html+=`<div class="alert bad">편성 실패: ${esc(genResult.error)}</div>`;
    if(genResult&&!genResult.error){
      html+=`<div class="alert note"><b>편성 완료${genResult.cycle?` — 순환 (${genResult.cycle.split('').join(' ')})`:''}</b> — 가용 ${genResult.capacity}명-일 / 필요 ${genResult.need}명-일${genResult.extraS?` (S 추가 근무 ${genResult.extraS}건)`:''}
      ${genResult.notes&&genResult.notes.length?'<br>'+genResult.notes.map(esc).join('<br>'):''}</div>`;
    }
    if(!filled){html+=`<div class="hint" style="margin-top:8px">아직 배정이 없습니다. 위의 「편성 실행」을 누르거나 칸을 직접 칠하세요.</div>`;}
    else{
      let n=0;const items=[];
      prio.forEach((id,i)=>{
        if(id==='LINE')return;
        n++;
        const it=info[id];if(!it||!it.on)return;
        const list=chk.byId[id];if(!list||!list.length)return;
        if(id==='pat')return; // 패턴은 「되도록」이라 아래에 따로
        const must=i<li;
        const shown=list.slice(0,8).map(x=>esc(x.msg)).join(', ')+(list.length>8?` 외 ${list.length-8}곳`:'');
        items.push(`<li${must?' style="font-weight:700"':''}>[${n}순위${must?' · 반드시':''}] ${esc(it.nm)} — ${shown}</li>`);
      });
      const offT=offTarget;
      if(!items.length)html+=`<div class="alert good">모든 규칙을 지켰습니다 · 모든 날짜 필요인원 충족${offT!==undefined?` · 전원 OFF ${offT}개`:''}</div>`;
      else html+=`<div class="alert bad"><b>규칙에 걸린 곳 ${items.length}가지</b> (위쪽 순위가 더 중요)<ol>${items.join('')}</ol></div>`;
      const pc=(chk.byId.pat||[]).length;
      if(info.pat.on&&pc)html+=`<div class="hint" style="margin-top:6px">패턴 순서와 다른 곳 ${pc}곳 (패턴은 되도록만 따릅니다)</div>`;
    }
  }
  html+=`</div>`;
  root.innerHTML=html;
  bindRosterTop();

  /* 셀 페인팅 */
  root.querySelectorAll('td.cell').forEach(td=>{
    td.addEventListener('mousedown',e=>{
      e.preventDefault();painting=true;paint(td);
      // 페인팅이 끝나는 mouseup에만 합계 재계산 (일반 버튼 클릭까지 재렌더로 씹히면 안 됨)
      document.addEventListener('mouseup',()=>{
        if(activeTab()==='roster')render();
      },{once:true});
    });
    td.addEventListener('mouseover',()=>{if(painting)paint(td);});
  });
  function paint(td){
    if(pinMode==='click'){ // 미리 정하기: 칸을 누르면 그 날을 고정 (같은 근무로 다시 누르면 풀림)
      const pid=td.dataset.p,d=+td.dataset.d;
      const pins=parsePins(pinsText(ym,pid),nd).pins;
      if(pinBrush===''||pins[d]===pinBrush){if(pins[d]==='V')setCell(ym,pid,d,'');delete pins[d];}
      else{pins[d]=pinBrush;if(pinBrush!=='V')setCell(ym,pid,d,pinBrush);}
      applyPins(ym,pid,pins);save();
      const v=getCell(ym,pid,d);
      td.className='cell '+(v?'v-'+v:'')+(pins[d]?' pinned':'');td.textContent=v==='V'?'연':v;
      return;
    }
    setCell(ym,td.dataset.p,+td.dataset.d,brush);
    save();
    // 드래그 중 전체 재렌더는 무겁고 포커스가 튐 → 칸만 즉시 갱신, 합계는 mouseup에서
    td.className='cell '+(brush?'v-'+brush:'');
    td.dataset.p&&(td.textContent=brush==='V'?'연':brush);
  }
}
function bindRosterTop(){
  const root=document.getElementById('tab-roster');
  root.querySelector('#prevM').onclick=()=>{S.ui.ym=shiftYm(S.ui.ym,-1);genResult=null;save();render();};
  root.querySelector('#nextM').onclick=()=>{S.ui.ym=shiftYm(S.ui.ym,1);genResult=null;save();render();};
  root.querySelector('#unitSel').onchange=e=>{S.ui.unitId=e.target.value;genResult=null;save();render();};
  const goRules=root.querySelector('#goRules');
  if(goRules)goRules.onclick=()=>document.querySelector('nav button[data-tab="rules"]').click();
  root.querySelectorAll('[data-pm]').forEach(b=>{b.onclick=()=>{pinMode=b.dataset.pm;render();};});
  root.querySelectorAll('[data-pb]').forEach(b=>{b.onclick=()=>{pinBrush=b.dataset.pb;root.querySelectorAll('[data-pb]').forEach(x=>x.classList.toggle('sel',x===b));};});
  const[ry,rm]=ymParts(S.ui.ym), rnd=daysIn(ry,rm);
  root.querySelectorAll('input[data-pin]').forEach(inp=>{
    inp.onchange=()=>{
      const r=parsePins(inp.value,rnd);
      const msg=root.querySelector('#pinMsg');
      if(r.bad.length){inp.classList.add('bad');if(msg)msg.innerHTML=`<div class="alert bad">알아볼 수 없는 부분: ${esc(r.bad.join(', '))} — 예: 5=연, 12-14=OFF, 20=N</div>`;return;}
      inp.classList.remove('bad');
      applyPins(S.ui.ym,inp.dataset.pin,r.pins);save();
      setTimeout(()=>{const nx=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.pin;render();if(nx){const el=document.querySelector(`input[data-pin="${nx}"]`);if(el)el.focus();}},0);
    };
  });
  const afClearV=root.querySelector('#afClearV');
  if(afClearV)afClearV.onclick=()=>{
    if(!confirm('이 유닛의 이번 달 연차 표시를 전부 지웁니다. (근무 배정은 그대로) 계속할까요?'))return;
    const cur=S.roster[S.ui.ym]||{};
    for(const p of unitStaff(S.ui.unitId)){
      const g=cur[p.id];if(!g)continue;
      for(const d of Object.keys(g))if(g[d]==='V')delete g[d];
    }
    save();render();
  };
  const afRun=root.querySelector('#afRun');
  if(afRun)afRun.onclick=()=>{
    const cur=S.roster[S.ui.ym];
    const people=unitStaff(S.ui.unitId);
    const hasData=cur&&people.some(p=>cur[p.id]&&Object.keys(cur[p.id]).length);
    if(hasData&&!confirm('이 유닛의 이번 달 배정을 새로 편성합니다. 미리 정한 날은 그대로 유지됩니다. 계속할까요?'))return;
    /* 미리 정하기 글칸 반영 */
    for(const inp of root.querySelectorAll('input[data-pin]')){
      const r=parsePins(inp.value,rnd);
      if(r.bad.length){alert(`알아볼 수 없는 부분이 있습니다: ${r.bad.join(', ')}\n예: 5=연, 12-14=OFF, 20=N`);inp.focus();return;}
      applyPins(S.ui.ym,inp.dataset.pin,r.pins);
    }
    const offT=(S.offs[String(ry)]||[])[rm-1]??9;
    genResult=priorityFill(S.ui.ym,S.ui.unitId,offT);
    if(!genResult.error)save();
    render();
  };
  root.querySelector('#printBtn').onclick=()=>window.print();
  root.querySelector('#xlsBtn').onclick=()=>exportXls();
  root.querySelector('#xlsIn').onchange=e=>{const f=e.target.files[0];if(f){importXls(f);e.target.value='';}};
  root.querySelector('#copyPrev').onclick=()=>{
    const prev=shiftYm(S.ui.ym,-1);
    const src=S.roster[prev];
    if(!src||Object.keys(src).length===0){alert(prev+' 데이터가 없습니다.');return;}
    const[y,m]=ymParts(S.ui.ym);
    const nd=daysIn(y,m);
    const people=unitStaff(S.ui.unitId);
    const cur=S.roster[S.ui.ym];
    const hasData=cur&&people.some(p=>cur[p.id]&&Object.keys(cur[p.id]).length);
    if(hasData&&!confirm('이번 달에 이미 배정이 있습니다. 이 유닛만 전월 내용으로 덮어쓸까요?'))return;
    for(const p of people){
      if(!src[p.id])continue;
      // 연차는 그 달에만 유효 — 복사하지 않음 (복사하면 다음 달에 연차가 저절로 생김)
      for(let d=1;d<=nd;d++){const v=src[p.id][d]||'';setCell(S.ui.ym,p.id,d,v==='V'?'':v);}
    }
    save();render();
  };
  root.querySelector('#clearM').onclick=()=>{
    const unit=unitById(S.ui.unitId);
    if(!confirm(`${S.ui.ym} 「${unit.name}」 유닛의 배정을 모두 지울까요?`))return;
    const cur=S.roster[S.ui.ym];
    if(cur) for(const p of unitStaff(S.ui.unitId)) delete cur[p.id];
    save();render();
  };
  const pal=root.querySelector('#palette');
  if(pal)pal.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{brush=b.dataset.b;pal.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  });
}

/* ===== 엑셀 내보내기 (엑셀이 읽는 HTML .xls — 기존 엑셀 표와 같은 모양·색) ===== */
function exportXls(){
  const ym=S.ui.ym,[y,m]=ymParts(ym),nd=daysIn(y,m);
  const unit=unitById(S.ui.unitId);
  const people=unit?unitStaff(unit.id):[];
  if(!people.length){alert('내보낼 직원이 없습니다.');return;}
  const COLORS={D:'#d7e9ff',E:'#ffe9cc',S:'#e5dcff',N:'#d0d4de',OFF:'#dff3e3',V:'#ffdce3'};
  const td=(v,style)=>`<td style="border:.5pt solid #999;text-align:center;${style||''}">${v}</td>`;
  let h=`<meta charset="UTF-8"><table>`;
  h+=`<tr><td></td><td></td><td colspan="${nd}" style="font-size:14pt;font-weight:bold;text-align:center">${y}년 ${m}월 근무표 (${esc(unit.name)})</td></tr>`;
  h+=`<tr>${td('성명','background:#333;color:#fff;font-weight:bold')}${td('구분','background:#333;color:#fff;font-weight:bold')}`;
  for(let d=1;d<=nd;d++){const w=new Date(y,m-1,d).getDay();h+=td(WD[w]+'<br>'+d,'background:#333;color:'+(w===0?'#ff8787':w===6?'#8fbaff':'#fff')+';font-weight:bold');}
  for(const c of ORD())h+=td(c,'background:#333;color:#fff;font-weight:bold');
  h+=td('OFF계','background:#333;color:#fff;font-weight:bold')+td('연차계','background:#333;color:#fff;font-weight:bold')+td('근무계','background:#333;color:#fff;font-weight:bold')+'</tr>';
  for(const p of people){
    const c={D:0,E:0,S:0,N:0,OFF:0,V:0};
    let row='';
    for(let d=1;d<=nd;d++){
      const v=getCell(ym,p.id,d);
      if(v)c[v]++;
      row+=td(v==='V'?'연차':(v||''),v?('background:'+COLORS[v]):'');
    }
    h+=`<tr>${td(esc(p.name),'font-weight:bold')}${td(p.fix?('고정('+p.fix+')'):'교대')}${row}${ORD().map(x=>td(c[x])).join('')}${td(c.OFF)}${td(c.V)}${td(c.D+c.E+c.S+c.N)}</tr>`;
  }
  h+=`<tr>${td('')}${td('근무인원','font-weight:bold')}`;
  for(let d=1;d<=nd;d++){
    let c=0;
    for(const p of people){const v=getCell(ym,p.id,d);if(v==='D'||v==='E'||v==='S'||v==='N')c++;}
    h+=td(c);
  }
  h+=`</tr>`;
  for(const code of [...ORD(),'OFF','V']){
    h+=`<tr>${td('')}${td((code==='V'?'연차':code)+' 합계','font-weight:bold')}`;
    for(let d=1;d<=nd;d++){
      let c=0;
      for(const p of people)if(getCell(ym,p.id,d)===code)c++;
      let bg='';
      if(['D','E','N'].includes(code)){ // S는 남는 인력 자리라 기준 색 없음
        const need=unit.need[code]||0;
        if(c<need)bg='background:#ffb3b3';else if(c>need)bg='background:#ffe08a';
      }
      h+=td(c||'',bg);
    }
    h+=`</tr>`;
  }
  h+='</table>';
  const blob=new Blob(['﻿'+h],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`근무표_${ym}_${unit.name}.xls`;
  a.click();URL.revokeObjectURL(a.href);
}

/* ===== 엑셀 불러오기 (기존 근무표 엑셀을 읽어 이 유닛으로) ===== */
function loadSheetJS(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX)return resolve(window.XLSX);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error('엑셀 라이브러리 로드 실패'));
    s.onerror=()=>reject(new Error('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));
    document.head.appendChild(s);
  });
}
function normShift(raw){
  const r=String(raw||'').trim().toUpperCase();
  if(!r)return '';
  if(r==='D'||r==='E'||r==='S'||r==='N')return r;
  if(r[0]==='O'||r.includes('OFF')||r.includes('오프')||r.includes('휴'))return 'OFF';
  if(r.includes('연차')||r==='V'||r==='연')return 'V';
  return '';
}
const SKIP_NAME=/합계|인원|근무|계$|off|연차|교대|고정|구분|성명|이름|유닛|층/i;
function parseRosterGrid(rows){
  let headerRow=-1, dayCols={};
  for(let ri=0;ri<Math.min(rows.length,15);ri++){
    const row=rows[ri]||[], map={};
    for(let ci=0;ci<row.length;ci++){
      const val=parseInt(String(row[ci]).trim(),10);
      if(val>=1&&val<=31&&String(row[ci]).trim()===String(val))map[ci]=val;
    }
    const days=new Set(Object.values(map));
    if(days.size>=20&&days.has(1)&&days.has(15)){headerRow=ri;dayCols=map;break;}
  }
  if(headerRow<0)return null;
  const firstDayCol=Math.min(...Object.keys(dayCols).map(Number));
  // 성명 열: 날짜열 왼쪽에서 이름다운 텍스트가 가장 많은 (왼쪽 우선) 열
  let nameCol=0,bestCnt=0;
  for(let ci=0;ci<firstDayCol;ci++){
    let cnt=0;
    for(let ri=headerRow+1;ri<rows.length;ri++){
      const val=String((rows[ri]||[])[ci]||'').trim();
      if(val&&!/^\d+$/.test(val)&&!SKIP_NAME.test(val)&&!val.includes('(')&&!val.includes('/'))cnt++;
    }
    if(cnt>bestCnt){bestCnt=cnt;nameCol=ci;}
  }
  let ym=null;
  for(const row of rows){for(const cell of (row||[])){const mt=String(cell).match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);if(mt){ym=mt[1]+'-'+String(+mt[2]).padStart(2,'0');break;}}if(ym)break;}
  const records=[];
  for(let ri=headerRow+1;ri<rows.length;ri++){
    const row=rows[ri]||[], name=String(row[nameCol]||'').trim();
    if(!name||SKIP_NAME.test(name)||/^\d+$/.test(name))continue;
    const days={};
    for(const ci in dayCols){const code=normShift(row[ci]);if(code)days[dayCols[ci]]=code;}
    if(Object.keys(days).length)records.push({name,days});
  }
  return {ym,days:Object.values(dayCols),records};
}
function importXls(file){
  loadSheetJS().then(XLSX=>{
    const r=new FileReader();
    r.onload=e=>{
      let wb;
      try{wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});}
      catch(err){alert('엑셀 파일을 읽을 수 없습니다: '+err.message);return;}
      let parsed=null;
      for(const nm of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,blankrows:false,defval:''});
        const p=parseRosterGrid(rows);
        if(p&&p.records.length){parsed=p;break;}
      }
      if(!parsed){alert('근무표 형식을 찾지 못했습니다.\n성명 열과 1~31 날짜가 가로로 있는 시트여야 합니다.');return;}
      applyImport(parsed);
    };
    r.readAsArrayBuffer(file);
  }).catch(err=>alert(err.message));
}
function applyImport(parsed){
  const unit=unitById(S.ui.unitId);
  if(!unit){alert('먼저 유닛을 선택하세요.');return;}
  const targetYm=parsed.ym||S.ui.ym;
  const byName={};for(const p of unitStaff(unit.id))byName[p.name]=p;
  const matched=parsed.records.filter(r=>byName[r.name]);
  const unmatched=parsed.records.filter(r=>!byName[r.name]);
  let msg=`「${unit.name}」 유닛에 ${targetYm} 근무표를 불러옵니다.\n인식 ${parsed.records.length}명 · 이름 매칭 ${matched.length}명`;
  if(unmatched.length)msg+=`\n미매칭: ${unmatched.map(r=>r.name).join(', ')}`;
  if(!confirm(msg+'\n\n계속할까요?'))return;
  let addMissing=false;
  if(unmatched.length)addMissing=confirm(`미매칭 ${unmatched.length}명(${unmatched.map(r=>r.name).join(', ')})을 「${unit.name}」에 새 직원으로 추가할까요?\n취소 = 매칭된 직원만 반영`);
  if(!S.roster[targetYm])S.roster[targetYm]={};
  const apply=(pid,days)=>{const o={};for(const d in days)o[d]=days[d];S.roster[targetYm][pid]=o;};
  for(const rec of matched)apply(byName[rec.name].id,rec.days);
  if(addMissing)for(const rec of unmatched){const np={id:uid(),name:rec.name,unitId:unit.id,fix:''};S.staff.push(np);apply(np.id,rec.days);}
  S.ui.ym=targetYm;
  save();render();
  alert(`불러오기 완료: ${targetYm} · ${matched.length+(addMissing?unmatched.length:0)}명 반영`);
}

/* ===== 휴일계산 탭 ===== */
function renderCalc(){
  const root=document.getElementById('tab-calc');
  const yr=S.ui.calcYear;
  if(!S.holidays[yr])S.holidays[yr]=Array(12).fill(0);
  if(!S.offs[yr])S.offs[yr]=Array(12).fill(9);
  const H=S.holidays[yr],O=S.offs[yr];
  const sumH=H.reduce((a,b)=>a+(+b||0),0),sumO=O.reduce((a,b)=>a+(+b||0),0);
  const sumA=H.reduce((a,b,i)=>a+Math.max(0,(+b||0)-(+O[i]||0)),0);
  const perMonthHours=(sumA*8*1.5/12);

  let html=`<div class="card"><div class="row">
    <h2 style="margin:0">휴일수 계산</h2>
    <select id="calcYear">${Object.keys(S.holidays).sort().map(v=>`<option ${v===yr?'selected':''}>${v}</option>`).join('')}</select>
    <button class="btn" id="addYear">연도 추가</button>
    <button class="btn" id="autoHoliday">휴일수 자동 계산</button>
    <div class="spacer"></div>
    <span class="hint">공휴일 수(주말+법정공휴일)와 그 달 오프수를 입력하면 휴일수당 일수가 자동 계산됩니다.</span>
  </div>
  <div style="overflow:auto;margin-top:12px"><table class="calc"><tr><th>월</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}<th>계</th></tr>
  <tr><td class="lbl">공휴일</td>${H.map((v,i)=>`<td><input type="number" min="0" max="20" value="${v}" data-k="h" data-i="${i}"></td>`).join('')}<td><b>${sumH}</b></td></tr>
  <tr><td class="lbl">오프수</td>${O.map((v,i)=>`<td><input type="number" min="0" max="20" value="${v}" data-k="o" data-i="${i}"></td>`).join('')}<td><b>${sumO}</b></td></tr>
  <tr class="total"><td class="lbl">휴일수당</td>${H.map((v,i)=>{const d=(+v||0)-(+O[i]||0);return `<td class="${d<0?'neg':''}">${d}</td>`;}).join('')}<td>${sumA}</td></tr>
  </table></div>
  <p class="hint" style="margin-top:8px">휴일수당 ${sumA}일 × 8시간 × 1.5 ÷ 12개월 = <b>월 ${perMonthHours.toFixed(1)}시간</b></p>
  </div>`;

  /* 유닛별 소요/연차여유 */
  html+=`<div class="card"><h2>유닛별 인력 소요 (${yr}년)</h2>
  <p class="hint" style="margin-bottom:12px">합계 = 인원×일수. 계 = OFF배정 + 고정 근무(D·E·N)×일수. S·연차 여유 = 합계 − 계 (S 근무와 연차로 쓸 수 있는 몫, 음수면 인원 부족).</p>
  <div class="unitcards">`;
  for(const u of S.units){
    const n=unitStaff(u.id).length||0;
    const ordDEN=ORD().filter(c=>c!=='S');
    html+=`<div><h3>${esc(u.name)} — ${n}명 / 하루 ${ordDEN.map(c=>c+(u.need[c]||0)).join('·')} (S는 남는 인력)</h3>
    <div style="overflow:auto"><table class="calc"><tr><th>월</th><th>일수</th><th>합계</th><th>OFF</th>${ordDEN.map(c=>`<th>${c}</th>`).join('')}<th>계</th><th>S·연차 여유</th></tr>`;
    for(let m=1;m<=12;m++){
      const nd=daysIn(+yr,m);
      const total=n*nd;
      const off=n*(+O[m-1]||0);
      const need={};let needSum=0;
      for(const c of ['D','E','N']){need[c]=(u.need[c]||0)*nd;needSum+=need[c];}
      const used=off+needSum;
      const slack=total-used;
      html+=`<tr><td>${m}월</td><td>${nd}</td><td>${total}</td><td>${off}</td>${ordDEN.map(c=>`<td>${need[c]}</td>`).join('')}<td>${used}</td><td class="${slack<0?'neg':''}"><b>${slack}</b></td></tr>`;
    }
    html+=`</table></div></div>`;
  }
  html+=`</div></div>`;
  root.innerHTML=html;

  root.querySelectorAll('table.calc input[type=number]').forEach(inp=>{
    inp.onchange=()=>{
      const i=+inp.dataset.i,v=+inp.value||0;
      if(inp.dataset.k==='h')S.holidays[yr][i]=v; else S.offs[yr][i]=v;
      save();renderCalc();
    };
  });
  root.querySelector('#calcYear').onchange=e=>{S.ui.calcYear=e.target.value;save();renderCalc();};
  root.querySelector('#addYear').onclick=()=>{
    const v=prompt('추가할 연도 (예: 2027)');
    if(!v||!/^\d{4}$/.test(v.trim()))return;
    const y=v.trim();
    if(!S.holidays[y]){
      S.holidays[y]=KR_HOLIDAYS[+y]?autoHolidayCounts(+y):Array(12).fill(0);
      S.offs[y]=Array(12).fill(9);
    }
    S.ui.calcYear=y;save();renderCalc();
  };
  root.querySelector('#autoHoliday').onclick=()=>{
    const y=+yr;
    const auto=autoHolidayCounts(y);
    const note=KR_HOLIDAYS[y]?'주말+법정공휴일(대체공휴일 포함) 기준으로 다시 계산합니다.':'이 연도는 공휴일 목록이 없어 주말만 계산됩니다. 공휴일은 표에서 직접 더해주세요.';
    if(!confirm(note+'\n지금 입력된 값을 덮어씁니다. 계속할까요?'))return;
    S.holidays[yr]=auto;save();renderCalc();
  };
}

/* ===== 급여 탭 ===== */
function renderPay(){
  const root=document.getElementById('tab-pay');
  const ym=S.ui.ym,[y,m]=ymParts(ym),nd=daysIn(y,m);
  const won=v=>Math.round(v).toLocaleString('ko-KR');
  /* 휴일가산: 엑셀 공식 그대로 — 연간 (공휴일−오프수) 합 × 8시간 × 1.5 ÷ 12개월 = 월 고정 가산시간 */
  const H=S.holidays[String(y)]||[],O=S.offs[String(y)]||[];
  const holiHours=H.reduce((a,b,i)=>a+Math.max(0,(+b||0)-(+O[i]||0)),0)*8*1.5/12;

  let html=`<div class="card"><div class="row">
    <div class="month-nav">
      <button class="btn" id="payPrevM">&lt;</button>
      <b>${y}년 ${m}월</b>
      <button class="btn" id="payNextM">&gt;</button>
    </div>
    <div class="spacer"></div>
    <label>야간 1회당 가산 환산시간 <input type="number" min="0" max="12" step="0.5" id="nightH" value="${S.payCfg.nightH}"></label>
  </div>
  <p class="hint" style="margin-top:8px">기본급 = 근무시간 × 시급. 야간가산 = 야간(N) 횟수 × 가산시간 × 시급 (기본 4시간 = 8시간의 0.5배). 휴일가산 = 월 ${holiHours.toFixed(1)}시간 × 시급 (휴일계산 탭의 연간 휴일수당 ÷ 12개월, 엑셀과 같은 공식). 참고용 계산이며 주휴수당·4대보험·세금은 반영하지 않습니다.</p></div>`;

  let gTotal=0;
  html+=`<div class="card"><div style="overflow:auto"><table class="calc"><tr><th>유닛</th><th>이름</th>${ORD().map(c=>`<th>${c}</th>`).join('')}<th>근무시간</th><th>시급</th><th>기본급</th><th>야간가산</th><th>휴일가산</th><th>합계</th></tr>`;
  for(const u of S.units){
    for(const p of unitStaff(u.id)){
      const c={D:0,E:0,S:0,N:0};
      for(let d=1;d<=nd;d++){const v=getCell(ym,p.id,d);if(c[v]!==undefined)c[v]++;}
      const hours=c.D*S.shifts.D.hours+c.E*S.shifts.E.hours+c.S*S.shifts.S.hours+c.N*S.shifts.N.hours;
      const wage=+p.wage||0;
      const base=hours*wage;
      const night=c.N*(+S.payCfg.nightH||0)*wage;
      const holi=holiHours*wage;
      const total=base+night+holi;
      gTotal+=total;
      html+=`<tr><td>${esc(u.name)}</td><td class="lbl">${esc(p.name)}</td>
        ${ORD().map(x=>`<td>${c[x]}</td>`).join('')}<td>${hours}</td>
        <td><input type="number" min="0" step="10" value="${wage||''}" placeholder="시급" data-wage="${p.id}" style="width:80px"></td>
        <td>${wage?won(base):'-'}</td><td>${wage?won(night):'-'}</td><td>${wage?won(holi):'-'}</td><td><b>${wage?won(total):'-'}</b></td></tr>`;
    }
  }
  html+=`<tr class="total"><td colspan="11" style="text-align:right">전체 합계</td><td>${won(gTotal)}</td></tr>`;
  html+=`</table></div></div>`;
  root.innerHTML=html;

  root.querySelector('#payPrevM').onclick=()=>{S.ui.ym=shiftYm(S.ui.ym,-1);save();renderPay();};
  root.querySelector('#payNextM').onclick=()=>{S.ui.ym=shiftYm(S.ui.ym,1);save();renderPay();};
  root.querySelector('#nightH').onchange=e=>{S.payCfg.nightH=+e.target.value||0;save();renderPay();};
  root.querySelectorAll('input[data-wage]').forEach(inp=>{
    inp.onchange=()=>{
      const p=S.staff.find(x=>x.id===inp.dataset.wage);
      if(p){p.wage=+inp.value||0;save();renderPay();}
    };
  });
}

/* ===== 규칙 탭 ===== */
function renderRules(){
  const root=document.getElementById('tab-rules');
  const unit=unitById(S.ui.unitId)||S.units[0];
  if(!unit){root.innerHTML=`<div class="card">설정 탭에서 유닛을 먼저 추가하세요.</div>`;return;}
  S.ui.unitId=unit.id;
  const own=!!(S.unitRules||{})[unit.id];
  const rc=RC(unit.id), info=ruleInfo(rc,unit), prio=prioOf(rc);
  const [y,m]=ymParts(S.ui.ym), nd=daysIn(y,m);
  const people=unitStaff(unit.id), nP=people.filter(p=>!p.fix).length;
  const offT=(S.offs[String(y)]||[])[m-1];
  const DEN=ORD().filter(c=>c!=='S');
  let h=`<div class="card"><div class="row">
    <label class="row" style="gap:6px;font-weight:600">유닛 <select id="ruUnit">${S.units.map(u=>`<option value="${u.id}" ${u.id===unit.id?'selected':''}>${esc(u.name)} (${unitStaff(u.id).length}명)</option>`).join('')}</select></label>
    <div class="seg"><button data-scope="unit" class="${own?'on':''}">이 유닛만</button><button data-scope="all" class="${own?'':'on'}">모든 유닛 똑같이</button></div>
    <div class="spacer"></div>
    <span class="hint">여기서 바꾼 규칙은 다음 「편성 실행」부터 적용됩니다</span>
  </div>
  <p class="hint" style="margin-top:6px">${own?`「${esc(unit.name)}」 유닛 전용 규칙을 고치는 중입니다. 다른 유닛은 영향 없음.`:'모든 유닛이 같이 쓰는 공통 규칙을 고치는 중입니다. (하루 필요인원만 유닛마다 따로)'}</p></div>`;

  /* 규칙 우선순위 */
  const li=prio.indexOf('LINE');let n=0;
  h+=`<div class="card"><div class="sec-title"><h2>규칙 우선순위</h2><button class="btn" id="prioReset">처음 순서로</button></div>
  <p class="lead">규칙끼리 부딪혀서 다 못 지킬 때, <b>아래쪽 규칙부터 양보</b>합니다. 위·아래 버튼으로 순서를 바꾸세요.</p>
  <div class="lvl"><span><b>빨간 선 위</b> = 반드시 지킴 (양보하지 않음, 그래도 못 지키면 결과에 빨갛게 알려줌)</span><span><b>빨간 선 아래</b> = 되도록 지킴 (필요하면 아래부터 양보)</span></div>
  <ol class="prio">${prio.map((id,i)=>{
    const mv=`<span class="mv"><button data-up="${i}" ${i===0?'disabled':''}>위</button><button data-dn="${i}" ${i===prio.length-1?'disabled':''}>아래</button></span>`;
    if(id==='LINE')return `<li class="line"><span>여기까지 반드시 지킴</span>${mv}</li>`;
    n++;const it=info[id]||{nm:id,grp:'',on:false};
    return `<li class="${i<li?'must':''} ${it.on?'':'off'}"><span class="no">${n}</span><span>${esc(it.nm)}<span class="grp">${esc(it.grp)}${it.on?'':' · 꺼짐'}</span></span>${mv}</li>`;
  }).join('')}</ol></div>`;

  /* 하루 필요인원 + 연속 제한 */
  h+=`<div class="split"><div class="card"><h2>하루 필요인원 <span class="hint">(${esc(unit.name)})</span></h2>
    <p class="lead">매일 꼭 있어야 하는 인원. 남는 인력은 전부 S로 들어갑니다.</p>
    <div class="row">${DEN.map(c=>`<label class="row" style="gap:6px">${shiftChip(c)}<input type="number" min="0" max="20" data-need="${c}" value="${unit.need[c]||0}"></label>`).join('')}</div>
    <p class="hint" style="margin-top:10px">설정 탭의 유닛 필요인원과 같은 값입니다. 한 곳에서만 고치면 됩니다.</p></div>
  <div class="card"><h2>연속 제한</h2>
    <p class="lead">한 사람이 이어서 할 수 있는 최대 일수.</p>
    <div class="row" style="gap:18px">
      <label class="row" style="gap:6px;font-weight:600">근무 최대 <input type="number" min="0" max="10" id="ruMaxRun" value="${rc.maxRun||0}">일</label>
      <label class="row" style="gap:6px;font-weight:600">OFF 최대 <input type="number" min="1" max="10" id="ruOffMax" value="${rc.offMax||2}">일</label>
    </div>
    <p class="hint" style="margin-top:10px">전월 마지막 날부터 이어서 셉니다. 근무 0 = 제한 없음.</p></div></div>`;

  /* 1인당 한 달 개수 */
  const capOf={D:rc.dCap,E:rc.eCap,N:rc.nCap}, capKey={D:'dCap',E:'eCap',N:'nCap'};
  const msgs=[];
  h+=`<div class="card"><div class="sec-title"><h2>1인당 한 달 개수</h2><span class="hint">${m}월 ${nd}일 · ${esc(unit.name)} 교대 ${nP}명 기준</span></div>
  <p class="lead">비워두면 자동으로 고르게. 회색은 필요한 평균이고, 평균보다 1 이상 크게 잡아야 대부분 맞춰집니다.</p><div class="grid4">`;
  for(const c of DEN){
    const avg=nP?(unit.need[c]||0)*nd/nP:0, v=capOf[c]||'';
    const bad=v!==''&&+v<avg;
    if(bad)msgs.push(`<b>${c} ${v}개는 맞출 수 없습니다.</b> 하루 ${unit.need[c]||0}명 × ${nd}일 = ${(unit.need[c]||0)*nd}개를 ${nP}명이 나누면 평균 ${avg.toFixed(1)}개입니다. ${Math.ceil(avg+1e-9)} 이상으로 잡으세요.`);
    h+=`<div class="cnt ${bad?'bad':''}"><div class="top">${shiftChip(c)}<input type="number" min="0" max="31" data-cap="${capKey[c]}" value="${v}" placeholder="${avg.toFixed(1)}"></div><span class="hint">필요 평균 ${avg.toFixed(1)}개</span></div>`;
  }
  {
    const base=DEN.reduce((a,c)=>a+(unit.need[c]||0),0);
    const workPer=nd-(offT??0);
    if(people.length&&offT!==undefined&&base*nd>people.length*workPer)msgs.push(`<b>OFF ${offT}개면 일손이 모자랍니다.</b> 하루 ${base}명 × ${nd}일 = ${base*nd}명-일이 필요한데, ${people.length}명 × ${workPer}일 = ${people.length*workPer}명-일뿐입니다.`);
    h+=`<div class="cnt"><div class="top">${shiftChip('OFF')}<input type="number" min="0" max="20" id="ruOff" value="${offT??''}"></div><span class="hint">모든 직원 같은 개수 · 휴일계산 탭 ${y}년 ${m}월 값</span></div>`;
  }
  h+=`</div>${msgs.length?msgs.map(x=>`<div class="alert bad">${x}</div>`).join(''):'<div class="alert good">지금 개수로 맞출 수 있습니다.</div>'}</div>`;

  /* 순서 규칙 (기본 + 직접 만든 규칙) */
  const BUILT=[
    {k:'nAfterOff',nm:'N 다음날은 OFF',ex:[['N'],['OFF']],note:(rc.pattern||'').includes('NN')?'패턴에 N N이 있으면 둘째 N까지 서고 OFF':''},
    {k:'noED',nm:'E 다음날 D 금지',ex:[['E'],['D',1]]},
    {k:'noNV',nm:'N 다음날 연차 금지',ex:[['N'],['V',1]]},
    {k:'noDafterNOFF',nm:'N, OFF 다음 D 금지',ex:[['N'],['OFF'],['D',1]]}
  ];
  const exHtml=ex=>ex.map(([c,x])=>shiftChip(c,x)).join('<span class="hint">→</span>');
  const crEx=r=>r.type==='seq2'?exHtml([[r.a],[r.b,1]]):r.type==='seq3'?exHtml([[r.a],[r.b],[r.c,1]]):exHtml([...Array(Math.min(+r.n||1,4))].map(()=>[r.a]).concat([[r.a,1]]));
  h+=`<div class="card"><div class="sec-title"><h2>순서 규칙</h2><button class="btn" id="crAddBtn">${crFormOpen?'닫기':'+ 규칙 추가'}</button></div>
  <p class="lead">어제·오늘 근무 순서에 대한 규칙. 기본 규칙과 직접 만든 규칙이 한 목록에 있습니다.</p>
  <ul class="rules">${BUILT.map(b=>`<li class="${rc[b.k]?'':'off'}"><input type="checkbox" class="sw" data-bt="${b.k}" ${rc[b.k]?'checked':''} aria-label="${b.nm} 켜기">
    <div><div class="nm">${b.nm}</div><div class="ex">${exHtml(b.ex)}${b.note?`<span class="hint" style="margin-left:6px">${b.note}</span>`:''}</div></div><span class="tag">기본</span></li>`).join('')}
  ${(rc.customRules||[]).map(r=>`<li class="${r.on!==false?'':'off'}"><input type="checkbox" class="sw" data-cr-on="${r.id}" ${r.on!==false?'checked':''} aria-label="${esc(ruleLabel(r))} 켜기">
    <div><div class="nm">${esc(ruleLabel(r))}</div><div class="ex">${crEx(r)}</div></div>
    <span class="row" style="gap:6px"><span class="tag">내 규칙</span><button class="btn" data-cr-del="${r.id}" style="padding:3px 9px;font-size:12px">삭제</button></span></li>`).join('')}</ul>
  ${crFormOpen?`<div class="row" style="margin-top:8px;padding:10px;border:1px dashed var(--line-strong);border-radius:10px">
      <select id="cr-type">
        <option value="seq2" ${crType==='seq2'?'selected':''}>어제 → 오늘 금지</option>
        <option value="seq3" ${crType==='seq3'?'selected':''}>그제 + 어제 → 오늘 금지</option>
        <option value="run" ${crType==='run'?'selected':''}>연속 최대 일수</option>
      </select>
      ${crType==='seq2'?`
        <label>어제 <select id="cr-a">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
        <label>오늘 금지 <select id="cr-b">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`
      :crType==='seq3'?`
        <label>그제 <select id="cr-a">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
        <label>어제 <select id="cr-b">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
        <label>오늘 금지 <select id="cr-c">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`
      :`
        <label>근무 <select id="cr-a">${CR_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
        <label>연속 최대 <input type="number" id="cr-n" min="1" max="10" value="2" style="width:52px">일</label>`}
      <button class="btn primary" id="crSave">저장</button>
      <span class="hint">저장하면 자동 편성이 지키고, 손으로 어기면 근무표에 빨간 테두리가 뜹니다</span>
    </div>`:''}</div>`;

  /* 패턴 */
  const PATS=[['SDENFF','S D E N F F'],['SDENNFF','S D E N N F F'],['DSENNFF','D S E N N F F'],['DSENFF','D S E N F F'],['ESDNFF','E S D N F F'],['ESDNF','E S D N F']];
  const pat=rc.pattern||'SDENFF';
  const fN=[...pat].filter(c=>c==='F').length, nN=[...pat].filter(c=>c==='N').length;
  const offM=fN/pat.length*nd, nM=nN/pat.length*nd;
  const fit=offT!==undefined&&Math.abs(offM-offT)<0.6;
  h+=`<div class="card"><h2>패턴</h2>
  <p class="lead">되도록 이 순서로 돌립니다. 위의 개수·규칙이 우선입니다 (우선순위에서 「패턴 순서」 위치로 조정).</p>
  <div class="row">
    <select id="ruPat">${PATS.map(([v,l])=>`<option value="${v}" ${pat===v?'selected':''}>${l}</option>`).join('')}</select>
    <span class="hint">F = 휴무</span>
    <span style="color:var(--line)">|</span>
    <b style="font-size:13px">방식</b>
    <label><input type="radio" name="ru-mode" value="cycle" ${rc.mode!=='greedy'?'checked':''}> 순환 <span class="hint">패턴 기본 + 개수는 기준대로</span></label>
    <label><input type="radio" name="ru-mode" value="greedy" ${rc.mode==='greedy'?'checked':''}> 자동 <span class="hint">매일 필요인원에 맞춰 채움</span></label>
  </div>
  <div class="strip">${[...Array(14)].map((_,i)=>{const c=pat[i%pat.length];return shiftChip(c==='F'?'OFF':c);}).join('')}</div>
  <div class="alert ${fit?'good':'note'}">이 패턴대로면 한 달 OFF 약 ${offM.toFixed(1)}개, N 약 ${nM.toFixed(1)}개. ${offT===undefined?'':fit?`OFF ${offT}개와 잘 맞습니다.`:`정한 OFF ${offT}개와 달라서, 개수를 먼저 맞추고 패턴은 되도록만 따릅니다.`}</div></div>`;

  /* 고정 근무 직원 */
  const fixed=people.filter(p=>p.fix), free=people.filter(p=>!p.fix);
  h+=`<div class="card"><h2>고정 근무 직원 <span class="hint">(${esc(unit.name)})</span></h2>
  <p class="lead">항상 같은 근무만 서는 직원. 설정 탭 직원 명단에서 바꾼 것과 같습니다.</p>
  <div class="row">${fixed.map(p=>`<span class="fixpill">${esc(p.name)} · ${shiftChip(p.fix)} 고정 <button data-unfix="${p.id}" title="고정 풀기">×</button></span>`).join('')||'<span class="hint">없음</span>'}</div>
  ${free.length?`<div class="row" style="margin-top:10px">
    <select id="fxP">${free.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <select id="fxC">${ORD().map(c=>`<option value="${c}" ${c==='S'?'selected':''}>${c} 고정</option>`).join('')}</select>
    <button class="btn" id="fxAdd">+ 고정 직원 추가</button></div>`:''}</div>`;

  root.innerHTML=h;
  const done=()=>{save();renderRules();};
  root.querySelector('#ruUnit').onchange=e=>{S.ui.unitId=e.target.value;genResult=null;done();};
  root.querySelectorAll('[data-scope]').forEach(b=>{b.onclick=()=>{
    if(b.dataset.scope==='unit'&&!own){
      const c={};for(const k of RULE_KEYS)c[k]=structuredClone(S.afCfg[k]??null);
      c.customRules=c.customRules||[];
      S.unitRules[unit.id]=c;done();
    }else if(b.dataset.scope==='all'&&own){
      if(!confirm(`「${unit.name}」 전용 규칙을 지우고 모든 유닛 공통 규칙을 씁니다. 계속할까요?`))return;
      delete S.unitRules[unit.id];done();
    }
  };});
  root.querySelector('#prioReset').onclick=()=>{rc.prio=null;done();};
  const mv=(i,j)=>{const p=prioOf(rc);[p[i],p[j]]=[p[j],p[i]];rc.prio=p;done();};
  root.querySelectorAll('[data-up]').forEach(b=>{b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1);});
  root.querySelectorAll('[data-dn]').forEach(b=>{b.onclick=()=>mv(+b.dataset.dn,+b.dataset.dn+1);});
  root.querySelectorAll('input[data-need]').forEach(inp=>{inp.onchange=()=>{unit.need[inp.dataset.need]=Math.max(0,+inp.value||0);done();};});
  root.querySelector('#ruMaxRun').onchange=e=>{rc.maxRun=Math.max(0,+e.target.value||0);done();};
  root.querySelector('#ruOffMax').onchange=e=>{rc.offMax=Math.max(1,+e.target.value||2);done();};
  root.querySelectorAll('input[data-cap]').forEach(inp=>{inp.onchange=()=>{rc[inp.dataset.cap]=Math.max(0,+inp.value||0);done();};});
  root.querySelector('#ruOff').onchange=e=>{
    const yr=String(y);if(!S.offs[yr])S.offs[yr]=Array(12).fill(9);
    S.offs[yr][m-1]=Math.max(0,+e.target.value||0);done();
  };
  root.querySelectorAll('input[data-bt]').forEach(cb=>{cb.onchange=()=>{rc[cb.dataset.bt]=cb.checked;done();};});
  root.querySelectorAll('[data-cr-on]').forEach(cb=>{cb.onchange=()=>{const r=rc.customRules.find(x=>x.id===cb.dataset.crOn);if(r){r.on=cb.checked;done();}};});
  root.querySelectorAll('[data-cr-del]').forEach(b=>{b.onclick=()=>{
    const r=rc.customRules.find(x=>x.id===b.dataset.crDel);
    if(!r||!confirm(`「${ruleLabel(r)}」 규칙을 삭제할까요?`))return;
    rc.customRules=rc.customRules.filter(x=>x.id!==r.id);if(rc.prio)rc.prio=rc.prio.filter(x=>x!=='c:'+r.id);done();
  };});
  root.querySelector('#crAddBtn').onclick=()=>{crFormOpen=!crFormOpen;renderRules();};
  const crTypeSel=root.querySelector('#cr-type');
  if(crTypeSel)crTypeSel.onchange=e=>{crType=e.target.value;renderRules();};
  const crSave=root.querySelector('#crSave');
  if(crSave)crSave.onclick=()=>{
    const g=id=>root.querySelector('#'+id)?.value;
    const r={id:uid(),type:crType,a:g('cr-a'),b:g('cr-b'),c:g('cr-c'),n:+g('cr-n')||2,on:true};
    if(r.type==='seq2'&&r.a===r.b&&r.a!=='W'){alert('어제와 오늘이 같으면 "연속 최대 일수" 형태를 쓰세요.');return;}
    if(!rc.customRules)rc.customRules=[];
    rc.customRules.push(r);crFormOpen=false;done();
  };
  root.querySelector('#ruPat').onchange=e=>{rc.pattern=e.target.value;done();};
  root.querySelectorAll('input[name="ru-mode"]').forEach(r=>{r.onchange=()=>{rc.mode=r.value;done();};});
  root.querySelectorAll('[data-unfix]').forEach(b=>{b.onclick=()=>{const p=S.staff.find(x=>x.id===b.dataset.unfix);if(p){p.fix='';done();}};});
  const fxAdd=root.querySelector('#fxAdd');
  if(fxAdd)fxAdd.onclick=()=>{const p=S.staff.find(x=>x.id===root.querySelector('#fxP').value);if(p){p.fix=root.querySelector('#fxC').value;done();}};
}

/* ===== 설정 탭 ===== */
function renderSettings(){
  const root=document.getElementById('tab-settings');
  let html=`<div class="card"><h2>유닛과 하루 필요인원</h2>
  <div style="overflow:auto"><table class="set"><tr><th>유닛명</th>${ORD().filter(c=>c!=='S').map(c=>`<th>${c}</th>`).join('')}<th>인원</th><th></th></tr>`;
  for(const u of S.units){
    html+=`<tr>
      <td><input type="text" value="${esc(u.name)}" data-u="${u.id}" data-k="name"></td>
      ${ORD().filter(c=>c!=='S').map(c=>`<td><input type="number" min="0" max="20" value="${u.need[c]||0}" data-u="${u.id}" data-k="${c}"></td>`).join('')}
      <td>${unitStaff(u.id).length}명</td>
      <td><button class="btn danger" data-del-u="${u.id}">삭제</button></td></tr>`;
  }
  html+=`</table></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="addUnit">유닛 추가</button></div></div>`;

  html+=`<div class="card"><h2>직원 명단</h2>`;
  for(const u of S.units){
    const ppl=unitStaff(u.id);
    html+=`<h3>${esc(u.name)} (${ppl.length}명)</h3><div class="stafflist">`;
    html+=ppl.map(p=>`<span class="chip"><span data-rename="${p.id}" title="이름 바꾸기" style="cursor:pointer">${esc(p.name)}</span>
      <select data-fix="${p.id}" title="고정 근무" style="border:0;background:none;font-size:12px;color:var(--sub);padding:0">
        <option value="">교대</option>
        ${ORD().map(c=>`<option value="${c}" ${p.fix===c?'selected':''}>${c} 고정</option>`).join('')}
      </select>
      <button data-del-p="${p.id}" title="삭제">×</button></span>`).join('');
    html+=`</div><div class="row" style="margin-top:8px">
      <input type="text" placeholder="이름 (쉼표로 여러 명)" data-add-input="${u.id}" style="width:240px">
      <button class="btn" data-add-p="${u.id}">추가</button>
      <span style="color:var(--line)">|</span>
      <input type="number" min="1" max="99" placeholder="인원수" data-cnt-input="${u.id}" style="width:90px">
      <button class="btn" data-add-cnt="${u.id}">A, B, C 이름으로 추가</button>
      <span class="hint">이름은 나중에 클릭해서 바꿀 수 있어요</span></div>`;
  }
  html+=`</div>`;

  html+=`<div class="card"><h2>근무유형</h2>
  <div class="row" style="margin-bottom:10px">
    <label>표시 순서 <input type="text" id="orderCfg" value="${ORD().join(' ')}" style="width:110px"></label>
    <span class="hint">D E S N 네 글자를 원하는 순서로 (예: E S D N) — 표·입력칸·엑셀 전부 이 순서로 나옵니다</span>
  </div>
  <div style="overflow:auto"><table class="set"><tr><th>코드</th><th>이름</th><th>근무시간</th></tr>`;
  for(const c of [...ORD(),'OFF','V']){
    const sh=S.shifts[c];
    html+=`<tr><td><b>${c==='V'?'연차':c}</b></td>
      <td><input type="text" value="${esc(sh.label)}" data-sh="${c}" data-k="label"></td>
      <td><input type="number" min="0" max="24" value="${sh.hours}" data-sh="${c}" data-k="hours" ${c==='OFF'||c==='V'?'disabled':''}></td></tr>`;
  }
  html+=`</table></div></div>`;

  html+=`<div class="card"><h2>데이터 백업</h2>
  <div class="row">
    <button class="btn" id="exportBtn">백업 파일 내려받기</button>
    <label class="btn" style="display:inline-block;cursor:pointer">백업 불러오기<input type="file" id="importFile" accept=".json" style="display:none"></label>
    <span class="hint">데이터는 이 브라우저에 저장됩니다. 다른 컴퓨터로 옮기거나 만약을 대비해 가끔 백업 파일을 받아두세요.</span>
  </div></div>`;

  root.innerHTML=html;

  root.querySelectorAll('input[data-u]').forEach(inp=>{
    inp.onchange=()=>{
      const u=unitById(inp.dataset.u);if(!u)return;
      if(inp.dataset.k==='name')u.name=inp.value.trim()||u.name;
      else u.need[inp.dataset.k]=+inp.value||0;
      save();renderSettings();
    };
  });
  root.querySelectorAll('[data-del-u]').forEach(b=>{
    b.onclick=()=>{
      const u=unitById(b.dataset.delU);
      const n=unitStaff(u.id).length;
      if(!confirm(`「${u.name}」 유닛을 삭제할까요?${n?` 소속 직원 ${n}명도 함께 삭제됩니다.`:''}`))return;
      S.staff=S.staff.filter(p=>p.unitId!==u.id);
      S.units=S.units.filter(x=>x.id!==u.id);
      if(S.ui.unitId===u.id)S.ui.unitId=S.units[0]?.id||'';
      save();renderSettings();
    };
  });
  root.querySelector('#addUnit').onclick=()=>{
    const name=prompt('유닛 이름');
    if(!name||!name.trim())return;
    S.units.push({id:uid(),name:name.trim(),need:{D:1,E:1,S:1,N:1}});
    save();renderSettings();
  };
  root.querySelectorAll('[data-add-p]').forEach(b=>{
    b.onclick=()=>{
      const inp=root.querySelector(`input[data-add-input="${b.dataset.addP}"]`);
      const names=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!names.length)return;
      for(const nm of names)S.staff.push({id:uid(),name:nm,unitId:b.dataset.addP});
      inp.value='';save();renderSettings();
    };
  });
  root.querySelectorAll('input[data-add-input]').forEach(inp=>{
    inp.onkeydown=e=>{if(e.key==='Enter')root.querySelector(`[data-add-p="${inp.dataset.addInput}"]`).click();};
  });
  const abc=i=>{let s='';i++;while(i>0){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26);}return s;}; // 0→A … 25→Z, 26→AA
  root.querySelectorAll('[data-add-cnt]').forEach(b=>{
    b.onclick=()=>{
      const inp=root.querySelector(`input[data-cnt-input="${b.dataset.addCnt}"]`);
      const cnt=Math.min(99,+inp.value||0);
      if(cnt<1)return;
      const used=new Set(S.staff.filter(p=>p.unitId===b.dataset.addCnt).map(p=>p.name));
      let i=0,made=0;
      while(made<cnt){
        const nm=abc(i++);
        if(used.has(nm))continue;
        S.staff.push({id:uid(),name:nm,unitId:b.dataset.addCnt,fix:''});
        made++;
      }
      inp.value='';save();renderSettings();
    };
  });
  root.querySelectorAll('[data-rename]').forEach(el=>{
    el.onclick=()=>{
      const p=S.staff.find(x=>x.id===el.dataset.rename);
      const nm=prompt('새 이름',p.name);
      if(nm&&nm.trim()){p.name=nm.trim();save();renderSettings();}
    };
  });
  root.querySelectorAll('select[data-fix]').forEach(sel=>{
    sel.onchange=()=>{
      const p=S.staff.find(x=>x.id===sel.dataset.fix);
      if(p){p.fix=sel.value;save();}
    };
  });
  root.querySelectorAll('[data-del-p]').forEach(b=>{
    b.onclick=()=>{
      const p=S.staff.find(x=>x.id===b.dataset.delP);
      if(!confirm(`${p.name} 님을 삭제할까요? 과거 근무표 기록도 화면에서 사라집니다.`))return;
      S.staff=S.staff.filter(x=>x.id!==p.id);
      save();renderSettings();
    };
  });
  root.querySelector('#orderCfg').onchange=e=>{
    const o=e.target.value.toUpperCase().replace(/[^DESN]/g,'').split('');
    if(o.length===4&&new Set(o).size===4){S.shiftOrder=o;save();renderSettings();}
    else{alert('D, E, S, N 네 글자를 한 번씩만 써주세요. 예: E S D N');renderSettings();}
  };
  root.querySelectorAll('input[data-sh]').forEach(inp=>{
    inp.onchange=()=>{
      const sh=S.shifts[inp.dataset.sh];
      if(inp.dataset.k==='label')sh.label=inp.value.trim()||sh.label;
      else sh.hours=+inp.value||0;
      save();
    };
  });
  root.querySelector('#exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='요양근무표_백업_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();URL.revokeObjectURL(a.href);
  };
  root.querySelector('#importFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.units||!d.roster)throw new Error('형식 오류');
        if(!confirm('현재 데이터를 백업 파일 내용으로 교체합니다. 계속할까요?'))return;
        S=migrate(d);save();render();
      }catch(err){alert('백업 파일을 읽을 수 없습니다: '+err.message);}
    };
    r.readAsText(f);
  };
}

/* ===== 렌더 ===== */
function render(){
  const t=activeTab();
  if(t==='roster')renderRoster();
  else if(t==='rules')renderRules();
  else if(t==='calc')renderCalc();
  else if(t==='pay')renderPay();
  else renderSettings();
}
render();
</script>
</body>
</html>
