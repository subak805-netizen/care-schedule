<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요양보호사 근무표</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --line:#e7e7ec; --line-strong:#d6d6dc;
  --txt:#1d1d1f; --sub:#86868b;
  --accent:#0071e3; --accent-soft:#eaf2fd;
  --c-D:#d9ebff; --c-Dt:#0a56b3;
  --c-E:#ffe7c4; --c-Et:#8f5400;
  --c-S:#e7dcff; --c-St:#5c34bb;
  --c-N:#d3d7e0; --c-Nt:#333a49;
  --c-OFF:#d8f2de; --c-OFFt:#1a7a3a;
  --c-V:#ffd8e1; --c-Vt:#b31f47;
  --warn:#e5484d; --over:#df8500;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(20,20,40,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header{background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;gap:20px;height:56px;position:sticky;top:0;z-index:50}
header h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
nav{display:flex;gap:2px;background:#ededf0;padding:3px;border-radius:11px}
nav button{border:0;background:none;padding:6px 16px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;border-radius:8px;transition:color .15s,background .15s}
nav button:hover{color:var(--txt)}
nav button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow-sm)}
main{padding:20px 22px 60px;max-width:1520px;margin:0 auto}
nav button,header h1{white-space:nowrap}
@media (max-width:640px){header{height:auto;flex-wrap:wrap;padding:8px 14px;gap:8px 12px}nav button{padding:6px 10px}main{padding:14px 12px 60px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
button.btn,label.btn{border:1px solid var(--line-strong);background:var(--card);padding:7px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;color:var(--txt);transition:background .15s,border-color .15s;line-height:1.4;white-space:nowrap}
button.btn:hover,label.btn:hover{background:var(--card-2);border-color:var(--sub)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:#0063c8;border-color:#0063c8}
button.btn.danger{color:var(--warn)}
button.btn.danger:hover{background:#fdecec;border-color:var(--warn)}
select,input[type=text],input[type=number]{border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:13px;background:var(--card);color:var(--txt);font-family:inherit;transition:border-color .15s,box-shadow .15s}
select:focus,input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{width:64px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::placeholder{color:#b8b8be}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{font-size:16px;min-width:120px;text-align:center;font-weight:700;letter-spacing:-.01em}
.hint{color:var(--sub);font-size:12px;line-height:1.6}
h2{font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:16px 0 7px}

/* 브러시 팔레트 */
.palette{display:flex;gap:6px;flex-wrap:wrap}
.palette button{border:2px solid transparent;border-radius:9px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;transition:transform .1s}
.palette button:active{transform:scale(.94)}
.palette button.sel{border-color:var(--txt)}
.pal-D{background:var(--c-D);color:var(--c-Dt)}
.pal-E{background:var(--c-E);color:var(--c-Et)}
.pal-S{background:var(--c-S);color:var(--c-St)}
.pal-N{background:var(--c-N);color:var(--c-Nt)}
.pal-OFF{background:var(--c-OFF);color:var(--c-OFFt)}
.pal-V{background:var(--c-V);color:var(--c-Vt)}
.pal-X{background:#fff;color:var(--sub);border:2px dashed var(--line-strong)!important}
.pal-X.sel{border:2px solid var(--txt)!important}

/* 근무표 그리드 */
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;user-select:none}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;background:var(--card)}
table.grid thead th{position:sticky;top:0;z-index:3;background:#f5f5f7;padding:6px 3px;min-width:34px;font-weight:600;color:var(--sub)}
table.grid thead th.namecol{left:0;z-index:5;color:var(--txt)}
table.grid td.namecol,table.grid th.namecol{position:sticky;left:0;z-index:2;background:var(--card);min-width:96px;max-width:130px;padding:6px 10px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:2px solid var(--line-strong)}
table.grid td.cell{min-width:34px;height:34px;cursor:pointer;font-weight:700}
table.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.grid .sun{color:var(--warn)}
table.grid .sat{color:var(--accent)}
td.v-D{background:var(--c-D);color:var(--c-Dt)}
td.v-E{background:var(--c-E);color:var(--c-Et)}
td.v-S{background:var(--c-S);color:var(--c-St)}
td.v-N{background:var(--c-N);color:var(--c-Nt)}
td.v-OFF{background:var(--c-OFF);color:var(--c-OFFt)}
td.v-V{background:var(--c-V);color:var(--c-Vt)}
td.cell.nwarn{box-shadow:inset 0 0 0 2px var(--warn)}
td.cell.pinned{text-decoration:underline dotted 2px}
table.grid td.sum{font-weight:600;background:var(--card-2);padding:5px 7px;min-width:38px}
table.grid td.sum.bad{color:var(--warn)}
table.grid td.sum.good{color:var(--c-OFFt)}
table.grid tfoot td{background:#f5f5f7;font-weight:600;padding:5px 2px;color:var(--sub)}
table.grid tfoot td.under{background:#fdecec;color:var(--warn)}
table.grid tfoot td.over{background:#fef1e0;color:var(--over)}
table.grid tfoot td.namecol{background:#f5f5f7;z-index:2;color:var(--txt)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* 경고 목록 */
.warnbox{background:#fdf3f3;border:1px solid #f4cfcf;border-radius:12px;padding:12px 15px;margin-top:12px;font-size:13px;color:#b0282c;line-height:1.8}

/* 휴일계산 */
table.calc{border-collapse:collapse;font-size:13px;width:100%}
table.calc th,table.calc td{border:1px solid var(--line);padding:7px 9px;text-align:center}
table.calc th{background:#f5f5f7;font-weight:600;color:var(--sub)}
table.calc td.neg{color:var(--warn);font-weight:700}
table.calc td.lbl{font-weight:600;background:var(--card-2)}
table.calc input[type=number]{width:56px;padding:4px;border-radius:6px}
table.calc tr.total td{background:#eef5ff;font-weight:700}
.unitcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px}

/* 설정 */
table.set{border-collapse:collapse;font-size:13px}
table.set th,table.set td{border:1px solid var(--line);padding:7px 9px;text-align:center}
table.set th{background:#f5f5f7;color:var(--sub);font-weight:600}
table.set input[type=text]{width:110px}
.stafflist{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f0f0f3;border-radius:18px;padding:5px 7px 5px 13px;font-size:13px;font-weight:600}
.chip button{border:0;background:#d8d8de;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;font-size:11px;color:var(--sub);transition:background .15s,color .15s}
.chip button:hover{background:var(--warn);color:#fff}
/* 규칙 탭 */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-weight:800;font-size:12px}
.sc-D{background:var(--c-D);color:var(--c-Dt)}.sc-E{background:var(--c-E);color:var(--c-Et)}.sc-S{background:var(--c-S);color:var(--c-St)}
.sc-N{background:var(--c-N);color:var(--c-Nt)}.sc-OFF{background:var(--c-OFF);color:var(--c-OFFt)}.sc-V{background:var(--c-V);color:var(--c-Vt)}
.sc-W{background:#eef0f4;color:var(--sub)}
.sc-X{background:transparent;color:var(--warn);border:1.5px dashed var(--warn)}
.lead{color:var(--sub);font-size:13px;margin:-6px 0 12px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-title h2{margin-bottom:12px}
.sec-title .seg{margin-bottom:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.alert{padding:9px 12px;border-radius:9px;font-size:13px;margin-top:10px;line-height:1.6}
.alert.bad{background:#fdecec;color:#b0282c}
.alert.good{background:#e8f6ec;color:#1e7a3c}
.alert.note{background:#fef6e4;color:#8f5400}
.alert ol{margin:4px 0 0;padding-left:20px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cnt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.cnt .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cnt.bad{border-color:var(--warn)}
.rules{list-style:none;display:grid}
.rules li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules .nm{font-weight:700}
.rules .ex{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:wrap}
.rules .tag{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.rules li.off .nm,.rules li.off .ex{opacity:.45}
.sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line-strong);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:19px}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--card);color:var(--sub);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.prio{list-style:none;display:grid;gap:6px}
.prio li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.prio li.must{border-color:var(--accent);background:var(--accent-soft)}
.prio li.off{opacity:.45}
.prio .no{font-weight:800;color:var(--sub);text-align:center}
.prio li.must .no{color:var(--accent)}
.prio .grp{font-size:11.5px;color:var(--sub);font-weight:600;margin-left:6px}
.prio .mv{display:flex;gap:4px}
.prio .mv button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line-strong);background:var(--card);color:var(--txt);border-radius:6px;padding:2px 8px;cursor:pointer}
.prio .mv button:disabled{opacity:.3;cursor:default}
.prio li.line{display:flex;justify-content:space-between;border:0;border-top:2px dashed var(--warn);border-radius:0;padding:8px 2px 4px;background:none;color:var(--warn);font-weight:800;font-size:12.5px}
.lvl{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin:0 0 10px}
.lvl b{color:var(--txt)}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.summary .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.summary .pill.bad{border-color:var(--warn);color:var(--warn)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px}
.people label{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;font-weight:600;font-size:13px}
.people label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people input{width:100%;min-width:0}
.people input.bad{border-color:var(--warn)}
.fixpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-weight:600;font-size:13px}
.fixpill button{border:0;background:#e3e3e8;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;font-size:11px;color:var(--sub)}
@media print{
  header,.no-print{display:none!important}
  .gridwrap{max-height:none;overflow:visible;border:0}
  body{background:#fff}
  .card{border:0;padding:0;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <h1>요양보호사 근무표</h1>
  <nav>
    <button data-tab="roster" class="on">근무표</button>
    <button data-tab="rules">규칙</button>
    <button data-tab="calc">휴일계산</button>
    <button data-tab="pay">급여</button>
    <button data-tab="settings">설정</button>
  </nav>
  <div class="spacer"></div>
  <span class="hint" id="saveState">자동저장</span>
</header>
<main>
  <section id="tab-roster"></section>
  <section id="tab-rules" style="display:none"></section>
  <section id="tab-calc" style="display:none"></section>
  <section id="tab-pay" style="display:none"></section>
  <section id="tab-settings" style="display:none"></section>
</main>
<script>
'use strict';
/* ===== 데이터 ===== */
const LS_KEY='care_schedule_v1';
const SHIFT_CODES=['D','E','S','N','OFF','V'];
function ORD(){ // 근무 표시 순서 (설정에서 변경 가능)
  const o=(S.shiftOrder||[]).filter(c=>['D','E','S','N'].includes(c));
  return (o.length===4&&new Set(o).size===4)?o:['E','S','D','N'];
}
/* ===== 사용자 정의 규칙 ===== */
const CR_OPTS=[['D','D'],['E','E'],['S','S'],['N','N'],['OFF','OFF'],['V','연차'],['W','아무 근무']];
const crName=t=>(CR_OPTS.find(o=>o[0]===t)||[t,t])[1];
const cmatch=(t,v)=>t==='W'?(v==='D'||v==='E'||v==='S'||v==='N'):v===t; // W = 아무 근무
function ruleLabel(r){
  if(r.type==='seq2')return `${crName(r.a)} 다음날 ${crName(r.b)} 금지`;
  if(r.type==='seq3')return `${crName(r.a)}, ${crName(r.b)} 다음 ${crName(r.c)} 금지`;
  return `${crName(r.a)} 연속 최대 ${r.n}일`;
}
function activeRules(rc){return ((rc||RC()).customRules||[]).filter(r=>r.on!==false);}
/* ===== 규칙 묶음: 유닛별(S.unitRules[유닛]) 또는 공통(S.afCfg) ===== */
function RC(unitId){
  const id=unitId||S.ui.unitId;
  return (S.unitRules||{})[id]||S.afCfg;
}
const RULE_KEYS=['mode','nAfterOff','noNV','noED','noDafterNOFF','maxRun','offMax','nCap','dCap','eCap','pattern','prio','customRules'];
const PRIO_DEFAULT=['need','r:nAfterOff','r:noNV','pin','mxo','LINE','off','r:noED','mxw','CUSTOM','capN','r:noDafterNOFF','capDE','pat'];
/* 우선순위 목록 정리: 빠진 규칙은 넣고 지운 직접 규칙은 뺌 (LINE = 여기까지 반드시 지킴) */
function prioOf(rc){
  const cids=(rc.customRules||[]).map(r=>'c:'+r.id);
  let p=Array.isArray(rc.prio)&&rc.prio.length?rc.prio.slice():PRIO_DEFAULT.flatMap(x=>x==='CUSTOM'?cids:[x]);
  p=p.filter(x=>x!=='CUSTOM'&&(!x.startsWith('c:')||cids.includes(x)));
  for(const x of PRIO_DEFAULT)if(x!=='CUSTOM'&&!p.includes(x))p.push(x);
  for(const c of cids)if(!p.includes(c)){const i=p.indexOf('pat');p.splice(i<0?p.length:i,0,c);}
  return p;
}
function shiftChip(c,x){return `<span class="sc ${x?'sc-X':'sc-'+c}">${x?'금지 ':''}${c==='V'?'연':c==='W'?'근무':c}</span>`;}
/* 규칙 하나하나의 이름·묶음·켜짐 여부 */
function ruleInfo(rc,unit){
  const nd=unit?unit.need:{};
  const info={
    need:{nm:'하루 필요인원',grp:'E'+(nd.E||0)+' D'+(nd.D||0)+' N'+(nd.N||0),on:true},
    pin:{nm:'미리 정한 날 (연차·OFF·지정 근무)',grp:'근무표 탭',on:true},
    off:{nm:'1인당 OFF 개수',grp:'1인당 개수',on:true},
    mxo:{nm:'연속 OFF 최대 '+(rc.offMax||2)+'일',grp:'연속 제한',on:true},
    mxw:{nm:'연속 근무 최대 '+(rc.maxRun||0)+'일',grp:'연속 제한',on:(rc.maxRun||0)>0},
    capN:{nm:'1인당 N 개수'+(rc.nCap?' ('+rc.nCap+'개)':''),grp:'1인당 개수',on:!!rc.nCap},
    capDE:{nm:'1인당 D·E 개수',grp:'1인당 개수',on:!!(rc.dCap||rc.eCap)},
    pat:{nm:'패턴 순서 ('+(rc.pattern||'').split('').join(' ')+')',grp:'패턴',on:!!rc.pattern},
    'r:nAfterOff':{nm:'N 다음날은 OFF',grp:'순서 규칙',on:!!rc.nAfterOff},
    'r:noNV':{nm:'N 다음날 연차 금지',grp:'순서 규칙',on:!!rc.noNV},
    'r:noED':{nm:'E 다음날 D 금지',grp:'순서 규칙',on:!!rc.noED},
    'r:noDafterNOFF':{nm:'N, OFF 다음 D 금지',grp:'순서 규칙',on:!!rc.noDafterNOFF}
  };
  for(const r of rc.customRules||[])info['c:'+r.id]={nm:ruleLabel(r),grp:'순서 규칙 · 내 규칙',on:r.on!==false};
  return info;
}
function parseAssign(str,nd){ // "5=D, 12-14=N" 또는 "5D 12N" → {day:code}
  const out={};
  for(const tok of String(str||'').split(/[,\s]+/)){
    const m=tok.match(/^(\d+)(?:[-~](\d+))?=?([DESNdesn])$/);
    if(!m)continue;
    const a=+m[1],b=m[2]?+m[2]:+m[1],c=m[3].toUpperCase();
    for(let d=a;d<=Math.min(b,nd);d++)if(d>=1)out[d]=c;
  }
  return out;
}
function parseDays(str,nd){ // "5, 12-14" → [5,12,13,14]
  const days=new Set();
  for(const tok of String(str||'').split(/[,\s]+/)){
    const range=tok.match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if(range){for(let d=+range[1];d<=Math.min(+range[2],nd);d++)if(d>=1)days.add(d);}
    else{const d=parseInt(tok,10);if(d>=1&&d<=nd)days.add(d);}
  }
  return [...days].sort((a,b)=>a-b);
}
/* 어제·그제 값과 오늘 code로 사용자 규칙 위반 검사. runBack(k)=k일 전 값 조회 함수 */
function crBad(rules,code,prev1,prev2,runBack){
  for(const r of rules){
    if(r.type==='seq2'&&cmatch(r.a,prev1)&&cmatch(r.b,code))return r;
    if(r.type==='seq3'&&cmatch(r.a,prev2)&&cmatch(r.b,prev1)&&cmatch(r.c,code))return r;
    if(r.type==='run'&&cmatch(r.a,code)){
      let run=1;
      for(let k=1;k<=12;k++){if(cmatch(r.a,runBack(k)))run++;else break;}
      if(run>(+r.n||1))return r;
    }
  }
  return null;
}

function autoHolidayCounts(y){
  const list=new Set(KR_HOLIDAYS[y]||[]);
  const out=[];
  for(let m=1;m<=12;m++){
    let c=0;
    const nd=new Date(y,m,0).getDate();
    for(let d=1;d<=nd;d++){
      const w=new Date(y,m-1,d).getDay();
      if(w===0||w===6||list.has(m+'-'+d))c++;

function migrate(d){
    for(const k of Object.keys(DEFAULTS)) if(d[k]===undefined) d[k]=structuredClone(DEFAULTS[k]);
    if(!d.afCfg.v3){d.afCfg={nAfterOff:true,noDafterNOFF:true,pattern:d.afCfg.pattern||'ESDNF',v3:true};} // 규칙 재정의 (2026-07 요청: N→OFF 무조건, N,OFF 뒤 D금지)
    if(d.afCfg.maxRun===undefined)d.afCfg.maxRun=4; // 5일 연속 근무 금지 (2026-07 요청)
    if(!d.afCfg.mode){d.afCfg.mode='cycle';if(d.afCfg.pattern==='ESDNF')d.afCfg.pattern='ESDNFF';} // 순환 편성 기본 (2026-07 기준표 요청)
    if(!d.afCfg.v5){d.afCfg.noDafterNOFF=false;d.afCfg.v5=true;} // N→OFF→D 금지 규칙 삭제 (2026-07 사용자 요청)
    if(d.afCfg.noED===undefined)d.afCfg.noED=true; // E 다음날 D 금지 (2026-07 사용자 요청)
    if(!d.afCfg.v7){d.afCfg.noDafterNOFF=true;d.afCfg.v7=true;} // N,OFF 다음 D 금지 재도입 (2026-07 사용자 요청)
    if(!d.shiftOrder)d.shiftOrder=['E','S','D','N']; // 표시 순서
    if(!d.customRules)d.customRules=[]; // 사용자 정의 규칙 (2026-07)
    if(d.afCfg.nCap===undefined)d.afCfg.nCap=5; // 1인당 N 기본 개수 (2026-07 사용자 요청)
    if(!d.afCfg.v8)d.afCfg.v8=true; // v8: N-OFF-OFF 소프트 우선 배치 (2026-08 사용자 요청 — 하드 금지는 수학적 불가로 소프트 처리)
    if(!d.pinOff)d.pinOff={}; // OFF 고정일 (2026-08 사용자 요청)
    if(!d.afCfg.v9){d.afCfg.noDafterNOFF=false;d.afCfg.v9=true;} // OFF 다음은 무엇이든 허용 (2026-08 사용자 요청)
    if(!d.afCfg.v10){if(d.afCfg.pattern==='ESDNFF')d.afCfg.pattern='SDENFF';d.afCfg.v10=true;} // 기준 문서 패턴 (2026-09)
    if(!d.pinShift)d.pinShift={}; // 근무 사전 지정 (2026-09)
    if(!d.afCfg.v11){ // 규칙 탭 (2026-10): N 다음날 연차 금지 분리, OFF 연속 최대 설정, 내 규칙을 규칙 묶음 안으로
      d.afCfg.noNV=d.afCfg.nAfterOff!==false;
      d.afCfg.offMax=2;
      d.afCfg.customRules=d.customRules||[];
      d.afCfg.prio=null;
      d.afCfg.v11=true;
    }
    if(!d.unitRules)d.unitRules={};
    return d;
}

function autoFill(opts){
  // opts: {ym, unitId, need:{D,E,S,N}, off, vac, nightRule}
  const [y,m]=ymParts(opts.ym), nd=daysIn(y,m);
  const people=unitStaff(opts.unitId);
  const n=people.length;
  if(!n) return {error:'이 유닛에 직원이 없습니다.'};
  /* 미리 찍어둔 연차는 그대로 두고 그 날을 피해서 편성 */
  const preset={};
  for(const p of people){
    const cur=(S.roster[opts.ym]||{})[p.id]||{};
    preset[p.id]=new Set(Object.keys(cur).filter(d=>cur[d]==='V').map(Number));
  }
  const pinned={},pinsh={},restRes={},lock={};
  for(const p of people){
    pinned[p.id]=new Set((((S.pinOff||{})[opts.ym]||{})[p.id]||[])); // OFF 고정일
    restRes[p.id]=new Set([...preset[p.id],...pinned[p.id]]); // 반드시 쉬는 날 (연차+고정OFF)
    const raw=(((S.pinShift||{})[opts.ym]||{})[p.id]||{}); // 근무 사전 지정
    pinsh[p.id]=new Map();
    for(const k in raw){const dd=+k;if(!restRes[p.id].has(dd))pinsh[p.id].set(dd,raw[k]);}
    lock[p.id]=new Set([...restRes[p.id],...pinsh[p.id].keys()]); // 편성이 못 건드리는 날 전체
  }
  const vacOf=p=>preset[p.id].size; // 연차는 입력한 날짜만 (자동배정 없음)
  const restOf=p=>opts.off+vacOf(p);
  for(const p of people)if(restOf(p)>=nd)return {error:p.name+': OFF와 연차 합이 그 달 일수 이상입니다.'};
  const baseNeed=['D','E','S','N'].reduce((a,c)=>a+(opts.need[c]||0),0);
  const capacity=people.reduce((a,p)=>a+nd-restOf(p),0);
  const surplus=capacity-baseNeed*nd;

  /* 전월 마지막 이틀을 0·-1일로 이어붙여 월 경계 연속성 반영 (N으로 끝났으면 1일은 강제 OFF) */
  const prevYm=shiftYm(opts.ym,-1);
  const prevRoster=S.roster[prevYm]||{};
  const [py,pm]=ymParts(prevYm), ndPrev=daysIn(py,pm);

  const isWorkCode=v=>v==='D'||v==='E'||v==='S'||v==='N';
  const grid={}, restLeft={}, nStreak={}, wStreak={}, oStreak={}, counts={};
  for(const p of people){
    grid[p.id]={};restLeft[p.id]=restOf(p);counts[p.id]={D:0,E:0,S:0,N:0};
    const pr=prevRoster[p.id]||{};
    for(let k=0;k<12;k++)grid[p.id][-k]=pr[ndPrev-k]||''; // 전월 마지막 12일 (경계 연속근무·OFF 검사용)
    {let ns=0;for(let k=0;k<3;k++){if(grid[p.id][-k]==='N')ns++;else break;}nStreak[p.id]=ns;} // 전월 말 N 연속 (N N 패턴 경계)
    // 전월 말 연속 근무·연속 OFF 이월 (최대 10일까지 역추적)
    let ws=0,os=0;
    for(let k=0;k<10;k++){const v=pr[ndPrev-k];if(isWorkCode(v))ws++;else break;}
    for(let k=0;k<10;k++){if(pr[ndPrev-k]==='OFF')os++;else break;}
    wStreak[p.id]=ws;oStreak[p.id]=os;
  }
  let restSlotsLeft=people.reduce((a,p)=>a+restOf(p),0);
  const shortage={}; let extraS=0;
  const custom=opts.custom||[];
  const OM=opts.offMax||2; // OFF 연속 최대
  const offFit=R=>Math.floor(OM*(R+1)/(OM+1)); // R일 남았을 때 OFF 연속 한도 안에서 쓸 수 있는 최대 휴무 수
  const cBad=(p,d,code)=>custom.length&&crBad(custom,code,grid[p.id][d-1]||'',grid[p.id][d-2]||'',k=>grid[p.id][d-k]||'');
  const presetLeft=p=>[...restRes[p.id]].filter(x=>x>curDay).length; // 오늘 이후 남은 지정연차·고정OFF
  let curDay=0;
  /* 선호 패턴 (예: ESDNF = E→S→D→N→휴무 순환): 오늘 근무의 "패턴상 전날 근무"가 어제와 일치하는 사람 우선 */
  const predOf={};
  const pat=(opts.pattern||'');
  if(pat.length>=2)for(let i=0;i<pat.length;i++)(predOf[pat[i]]=predOf[pat[i]]||new Set()).add(pat[(i-1+pat.length)%pat.length]);
  const nn=opts.nAfterOff&&pat.includes('NN'); // 패턴에 N N → 야간은 2일 연속까지
  const capOf=c=>c==='N'?(opts.nCap||0):c==='D'?(opts.dCap||0):c==='E'?(opts.eCap||0):0;
  const CAPF=capOf;
  const isRest=v=>v==='OFF'||v==='V';
  const patScore=(p,code,d)=>{ // 0=패턴 일치, 1=불일치/판단불가
    const pr=predOf[code];if(!pr||d<1)return 1;
    const g=grid[p.id][d-1];
    return ((pr.has('F')&&isRest(g))||pr.has(g))?0:1;
  };

  for(let d=1;d<=nd;d++){
    curDay=d;
    const daysLeft=nd-d+1;
    /* 쉬는 사람 고르기: ①지정 연차 ②야간(N) 다음날 강제 OFF ③남은 휴무를 남은 일수에 다 써야 하는 사람 ④휴무 비율 높은 순 */
    const resters=new Set(), contN=new Set(); // contN = 어제 첫 N → 오늘 둘째 N (패턴 N N)
    const pinNToday=people.filter(p=>pinsh[p.id].get(d)==='N').length; // 오늘 N으로 지정된 인원
    for(const p of people){
      if(restRes[p.id].has(d)){resters.add(p.id);continue;} // 지정 연차·OFF 고정일
      if(pinsh[p.id].has(d))continue; // 근무 지정일 — 쉴 수 없음
      if(opts.nAfterOff&&nStreak[p.id]>=1){
        const rl=restLeft[p.id]-presetLeft(p);
        if(nn&&nStreak[p.id]===1&&contN.size<(opts.need.N||0)-pinNToday&&!(opts.maxRun&&wStreak[p.id]>=opts.maxRun)
          &&rl<daysLeft&&rl<=offFit(daysLeft-1)){contN.add(p.id);continue;}
        resters.add(p.id);continue; // N 다음날 무조건 OFF (N N이면 둘째 N 다음날)
      }
      if(restLeft[p.id]-presetLeft(p)<=0)continue;
      if(opts.maxRun){
        if(wStreak[p.id]>=opts.maxRun){resters.add(p.id);continue;} // 연속 근무 한도 도달 → 강제 휴무
        /* 오늘 일하면 남은 휴무로 연속 한도를 못 지키게 되는 경우도 강제 휴무 (월말 5일 연속 방지, OFF 3연속은 만들지 않음) */
        const q=restLeft[p.id], m=opts.maxRun;
        if(oStreak[p.id]<OM&&(m-wStreak[p.id]-1)+q*(m+1)<daysLeft-1){resters.add(p.id);continue;}
      }
      /* 오늘 안 쉬면 남은 날에 휴무를 다 못 쓰는 사람 (OFF 2연속 제한 기준) → 강제 휴무 (월말 몰림 방지) */
      if(oStreak[p.id]<OM&&restLeft[p.id]-presetLeft(p)>offFit(daysLeft-1)){resters.add(p.id);continue;}
      if(restLeft[p.id]>=daysLeft)resters.add(p.id);
    }
    let target=Math.round(restSlotsLeft/daysLeft);
    target=Math.max(target,resters.size);
    target=Math.min(target,Math.max(resters.size,n-baseNeed)); // 필요인원만큼은 반드시 근무에 남김
    const cands=people.filter(p=>{
        if(resters.has(p.id)||restLeft[p.id]-presetLeft(p)<=0)return false;
        if(pinsh[p.id].has(d))return false; // 근무 지정일 — 쉴 수 없음
        if(contN.has(p.id))return false; // 둘째 N 서는 날
        if(oStreak[p.id]>=OM)return false; // OFF는 이어서 OM개까지만
        {let k=0;while(pinned[p.id].has(d+1+k))k++;if(oStreak[p.id]+1+k>OM)return false;} // 오늘 쉬면 고정 OFF와 이어져 OFF 연속 초과
        if(cBad(p,d,'OFF'))return false; // 사용자 규칙
        /* 오늘 쉬면 남은 휴무로 연속 한도를 못 지키게 되는 사람은 휴무를 아껴둠 (월말 5일 연속 방지) */
        if(opts.maxRun){
          const q=restLeft[p.id]-1, R=daysLeft-1;
          if(opts.maxRun*(q+1)<R-q)return false;
        }
        return true;
      })
      .sort((a,b)=>wStreak[b.id]-wStreak[a.id] // 연속 근무가 긴 사람 먼저 (한꺼번에 강제휴무 몰림 방지)
        ||restLeft[b.id]/daysLeft-restLeft[a.id]/daysLeft // 휴무가 밀린 사람 먼저 (월말 OFF 몰림 방지)
        ||patScore(a,'F',d)-patScore(b,'F',d) // 그 다음에 패턴상 쉴 차례
        ||((people.indexOf(a)+d)%n)-((people.indexOf(b)+d)%n));
    for(const p of cands){if(resters.size>=target)break;resters.add(p.id);}

    /* 근무 배정 */
    const workers=people.filter(p=>!resters.has(p.id));
    const assigned={};
    const slots={N:opts.need.N||0,S:opts.need.S||0,E:opts.need.E||0,D:opts.need.D||0};
    for(const p of workers){ // 고정 근무 직원
      if(!assigned[p.id]&&p.fix){assigned[p.id]=p.fix;slots[p.fix]--;}
    }
    for(const p of workers){ // 근무 사전 지정 (연차처럼 D/E/S/N 미리 지정)
      const pc=pinsh[p.id].get(d);
      if(!assigned[p.id]&&pc){assigned[p.id]=pc;slots[pc]--;}
    }
    for(const p of workers){ // 패턴 N N: 어제 첫 N이던 사람은 오늘 둘째 N
      if(!assigned[p.id]&&contN.has(p.id)){assigned[p.id]='N';slots.N--;}
    }
    /* 오늘 D를 못 서는 사람 모음 (전월 경계 포함) */
    const noD=new Set();
    for(const p of workers){
      const g=grid[p.id];
      if(opts.noDafterNOFF&&(g[d-1]==='OFF'||g[d-1]==='V')&&g[d-2]==='N')noD.add(p.id);
      if(opts.noED&&g[d-1]==='E')noD.add(p.id); // E 다음날 D 금지
    }
    for(const code of ['N','S','E','D']){ // 같은 근무 횟수가 적은 사람부터
      while(slots[code]>0){
        const pool=workers.filter(p=>!assigned[p.id]&&!(code==='D'&&noD.has(p.id))&&!(opts.noED&&code==='E'&&pinsh[p.id].get(d+1)==='D')&&!cBad(p,d,code));
        if(!pool.length){
          /* 남은 사람이 규칙 탓에 이 근무를 못 서면, 이미 배정된 사람과 역할 맞교환 */
          let fixed=false;
          outer:
          for(const w of workers){
            if(!assigned[w.id]||assigned[w.id]===code)continue;
            if(pinsh[w.id].has(d))continue; // 근무 지정자는 바꾸지 않음
            if(code==='D'&&noD.has(w.id))continue;
            if(code==='N'&&(preset[w.id].has(d+1)||pinsh[w.id].has(d+1)))continue; // N 다음날 연차·근무지정 금지
            if(opts.noED&&code==='E'&&pinsh[w.id].get(d+1)==='D')continue; // 내일 D 지정자에게 E 금지
            if(cBad(w,d,code))continue;
            const wc=assigned[w.id];
            for(const q of workers){
              if(assigned[q.id]||q===w)continue;
              if(wc==='D'&&noD.has(q.id))continue;
              if(wc==='N'&&(preset[q.id].has(d+1)||pinsh[q.id].has(d+1)))continue; // N 다음날 연차·근무지정 금지
              if(opts.noED&&wc==='E'&&pinsh[q.id].get(d+1)==='D')continue; // 내일 D 지정자에게 E 금지
              if(cBad(q,d,wc))continue;
              assigned[w.id]=code;assigned[q.id]=wc;fixed=true;break outer;
            }
          }
          if(!fixed){shortage[d]=(shortage[d]||[]);shortage[d].push(code+' '+slots[code]+'명');break;}
          slots[code]--;continue;
        }
        const spare=p=>restLeft[p.id]-presetLeft(p)>0?0:1; // 야간 뒤에 쉴 여유가 있는가
        /* N을 받으면 내일 강제 OFF로 휴무가 하나 빠짐 — 그 뒤에도 연속 한도를 지킬 수 있는 사람인가 */
        const affordN=p=>{
          const q=restLeft[p.id]-presetLeft(p);
          if(q<=0)return 1;
          if(opts.maxRun&&opts.maxRun*q<daysLeft-1-q)return 1;
          return 0;
        };
        const totalW=p=>counts[p.id].D+counts[p.id].E+counts[p.id].S+counts[p.id].N;
        if(code==='N'){
          /* N 다음날은 무조건 OFF — 다음날이 지정 연차인 사람에게는 N 금지 */
          const nv=pool.filter(p=>!preset[p.id].has(d+1)&&!pinsh[p.id].has(d+1)
            &&!(nn&&(restRes[p.id].has(d+1)||preset[p.id].has(d+2)||pinsh[p.id].has(d+2)||(opts.maxRun&&wStreak[p.id]+2>opts.maxRun)
              ||restLeft[p.id]-presetLeft(p)>offFit(Math.max(0,daysLeft-2))))); // N N이면 이틀 서고 쉴 수 있는 사람
          if(nv.length){pool.length=0;pool.push(...nv);}
          /* 내일 쉴 몫이 없는 사람에게 N을 주면 OFF가 목표를 초과함 — 가능하면 제외 */
          const np=pool.filter(p=>restLeft[p.id]-presetLeft(p)>0);
          const poolN=np.length?np:pool.slice();
          pool.length=0;pool.push(...poolN);
          const overCap=p=>opts.nCap&&counts[p.id].N>=opts.nCap?1:0; // 1인당 N 기본 개수 채운 사람은 후순위
          /* N은 골고루: 그제도 N이던 사람(N OFF N 반복)은 후순위, N 횟수 적은 사람 우선 */
          pool.sort((a,b)=>affordN(a)-affordN(b)
            ||overCap(a)-overCap(b)
            ||spare(a)-spare(b)
            ||(grid[a.id][d-2]==='N'?1:0)-(grid[b.id][d-2]==='N'?1:0)
            ||counts[a.id].N-counts[b.id].N
            ||patScore(a,code,d)-patScore(b,code,d)
            ||totalW(a)-totalW(b));
        }else{
          const over=p=>capOf(code)&&counts[p.id][code]>=capOf(code)?1:0; // 1인당 기본 개수 채운 사람은 후순위
          pool.sort((a,b)=>
            (code!=='D'?(noD.has(b.id)?1:0)-(noD.has(a.id)?1:0):0) // D 못 서는 사람을 E/S에 먼저 배치해 D 자리 확보
            ||over(a)-over(b)
            ||patScore(a,code,d)-patScore(b,code,d) // 선호 패턴 순서에 맞는 사람 우선
            ||counts[a.id][code]-counts[b.id][code]
            ||totalW(a)-totalW(b));
        }
        assigned[pool[0].id]=code;slots[code]--;
      }
    }
    for(const p of workers)if(!assigned[p.id]){assigned[p.id]='S';extraS++;} // 여유 인력은 S 추가(깍두기)

    for(const p of people){
      if(resters.has(p.id)){
        restLeft[p.id]--;restSlotsLeft--;nStreak[p.id]=0;wStreak[p.id]=0;
        const isV=preset[p.id].has(d);
        grid[p.id][d]=isV?'V':'OFF';
        oStreak[p.id]=isV?0:oStreak[p.id]+1; // OFF 연속 (연차는 별개)
      }
      else{const c=assigned[p.id];grid[p.id][d]=c;counts[p.id][c]++;nStreak[p.id]=c==='N'?nStreak[p.id]+1:0;wStreak[p.id]++;oStreak[p.id]=0;}
    }
  }
  /* 마무리 수리: 드물게 남는 연속 초과·OFF 초과를 두 사람의 날짜 교환으로 해결 */
  const isW=v=>v==='D'||v==='E'||v==='S'||v==='N';
  const gv=(p,dd)=>grid[p.id][dd]||'';
  const okPerson=p=>{ // 한 사람 한 달 전체 규칙 검증 (전월 이월 포함)
    let run=0,orun=0;
    for(let k=0;k>-12;k--){if(isW(gv(p,k)))run++;else break;}
    for(let k=0;k>-12;k--){if(gv(p,k)==='OFF')orun++;else break;}
    for(let dd=1;dd<=nd;dd++){
      const v=gv(p,dd);
      if(isW(v)){run++;if(opts.maxRun&&run>opts.maxRun)return false;}else run=0;
      if(v==='OFF'){orun++;if(orun>OM)return false;}else orun=0; // OFF는 이어서 OM개까지만
      if(opts.nAfterOff&&gv(p,dd-1)==='N'&&isW(v)&&!(nn&&v==='N'&&gv(p,dd-2)!=='N'))return false; // N 다음은 OFF (N N 패턴이면 둘째 N까지)
      if(opts.noED&&gv(p,dd-1)==='E'&&v==='D')return false; // E 다음날 D 금지
      if(opts.noDafterNOFF&&v==='D'&&(gv(p,dd-1)==='OFF'||gv(p,dd-1)==='V')&&gv(p,dd-2)==='N')return false; // N,OFF 다음 D 금지
      if(custom.length&&crBad(custom,v,gv(p,dd-1),gv(p,dd-2),k=>gv(p,dd-k)))return false; // 사용자 규칙
      if(opts.noNV&&v==='V'&&gv(p,dd-1)==='N')return false; // N 다음날 연차 금지
    }
    return true;
  };
  const notes=[];
  for(const p of people){
    /* OFF 초과: 하루를 S로 전환 (규칙 통과할 때만) */
    let offC=()=>Object.keys(grid[p.id]).filter(dd=>+dd>=1&&grid[p.id][dd]==='OFF').length;
    let guard=0;
    while(offC()>opts.off&&guard++<10){
      let done=false;
      for(let dd=1;dd<=nd&&!done;dd++){
        if(grid[p.id][dd]!=='OFF'||lock[p.id].has(dd))continue;
        grid[p.id][dd]='S';
        if(okPerson(p)){done=true;extraS++;}else grid[p.id][dd]='OFF';
      }
      if(!done){
        /* 직접 전환이 다 막히면: 초과 OFF를 다른 사람에게 넘기고 그 사람이 근무로 바꿈 */
        outer2:
        for(let dd=1;dd<=nd&&!done;dd++){
          if(grid[p.id][dd]!=='OFF'||lock[p.id].has(dd))continue;
          for(const q of people){
            if(q===p)continue;
            const qc=grid[q.id][dd];
            if(!isW(qc)||lock[q.id].has(dd))continue;
            if(p.fix&&p.fix!==qc)continue;
            grid[p.id][dd]=qc;grid[q.id][dd]='OFF';
            if(okPerson(p)&&okPerson(q)){
              for(let d3=1;d3<=nd;d3++){
                if(grid[q.id][d3]!=='OFF'||lock[q.id].has(d3)||d3===dd)continue;
                grid[q.id][d3]='S';
                if(okPerson(q)){done=true;extraS++;break;}
                grid[q.id][d3]='OFF';
              }
            }
            if(done)break outer2;
            grid[p.id][dd]='OFF';grid[q.id][dd]=qc;
          }
        }
      }
      if(!done){notes.push(`${p.name}: OFF ${offC()}개 (목표 ${opts.off}개) — 규칙 안에서 못 줄였습니다`);break;}
    }
    /* 연속 초과: p가 그날 쉬고, 그날 쉬던 q가 대신 근무 + 반대날 맞교환 */
    for(let dd=1;dd<=nd;dd++){
      if(okPerson(p))break;
      if(!isW(gv(p,dd))||lock[p.id].has(dd))continue;
      let swapped=false;
      for(const q of people){
        if(q===p||gv(q,dd)!=='OFF'||lock[q.id].has(dd))continue;
        if(q.fix&&q.fix!==gv(p,dd))continue;
        for(let d2=Math.max(1,dd-7);d2<=Math.min(nd,dd+7)&&!swapped;d2++){
          if(d2===dd||gv(p,d2)!=='OFF'||lock[p.id].has(d2)||!isW(gv(q,d2))||lock[q.id].has(d2))continue;
          if(p.fix&&p.fix!==gv(q,d2))continue;
          const a=gv(p,dd),b=gv(q,d2);
          grid[p.id][dd]='OFF';grid[q.id][dd]=a;
          grid[q.id][d2]='OFF';grid[p.id][d2]=b;
          if(okPerson(p)&&okPerson(q))swapped=true;
          else{grid[p.id][dd]=a;grid[q.id][dd]='OFF';grid[q.id][d2]=b;grid[p.id][d2]='OFF';}
        }
        if(swapped)break;
      }
    }
    /* OFF 3연속 등: 반대 방향 — p가 그날 근무하고, 그날 근무하던 q가 대신 쉼 + 반대날 맞교환 */
    for(let dd=1;dd<=nd;dd++){
      if(okPerson(p))break;
      if(gv(p,dd)!=='OFF'||lock[p.id].has(dd))continue;
      let swapped=false;
      for(const q of people){
        if(q===p)continue;
        const qc=gv(q,dd);
        if(!isW(qc)||lock[q.id].has(dd))continue;
        if(p.fix&&p.fix!==qc)continue;
        for(let d2=Math.max(1,dd-7);d2<=Math.min(nd,dd+7)&&!swapped;d2++){
          if(d2===dd||!isW(gv(p,d2))||lock[p.id].has(d2)||gv(q,d2)!=='OFF'||lock[q.id].has(d2))continue;
          if(q.fix&&q.fix!==gv(p,d2))continue;
          const a=gv(p,d2);
          grid[p.id][dd]=qc;grid[q.id][dd]='OFF';
          grid[p.id][d2]='OFF';grid[q.id][d2]=a;
          if(okPerson(p)&&okPerson(q))swapped=true;
          else{grid[p.id][dd]='OFF';grid[q.id][dd]=qc;grid[p.id][d2]=a;grid[q.id][d2]='OFF';}
        }
        if(swapped)break;
      }
    }
    if(!okPerson(p))notes.push(`${p.name}: 규칙(연속 근무·OFF 연속)을 다 못 맞춘 부분이 있습니다 — 손으로 조정해 주세요`);
  }
  /* 근무 개수 균형(N→D→E→S 순): 최대-최소 격차 1 이하가 될 때까지 같은 날 근무끼리 맞바꿈 (일별 인원·OFF·연속 불변) */
  {
    const cnt=(p,c)=>{let k=0;for(let dd=1;dd<=nd;dd++)if(grid[p.id][dd]===c)k++;return k;};
    const flex=people.filter(p=>!p.fix);
    /* N 균형(3일 묶음): over의 [N,OFF](dd,dd+1) ↔ under의 [X,Y] + 다른 날 over의 근무 W ↔ under의 OFF
       → 두 사람 OFF 개수·일별 인원 그대로, N만 이동 */
    if(opts.nCap){
      let guard=0;
      while(flex.length&&guard++<80){
        const over=flex.slice().sort((a,b)=>cnt(b,'N')-cnt(a,'N'))[0];
        const unders=flex.slice().sort((a,b)=>cnt(a,'N')-cnt(b,'N'));
        if(cnt(over,'N')-cnt(unders[0],'N')<=1)break;
        let swapped=false;
        for(let dd=1;dd<nd&&!swapped;dd++){
          if(grid[over.id][dd]!=='N'||grid[over.id][dd+1]!=='OFF'||lock[over.id].has(dd)||lock[over.id].has(dd+1))continue;
          for(const u of unders){
            if(u===over||cnt(over,'N')-cnt(u,'N')<=1)break;
            const X=grid[u.id][dd],Y=grid[u.id][dd+1];
            if(!isW(X)||!isW(Y)||X==='N'||Y==='N'||lock[u.id].has(dd)||lock[u.id].has(dd+1))continue;
            for(let d3=1;d3<=nd&&!swapped;d3++){
              if(d3===dd||d3===dd+1)continue;
              const W=grid[over.id][d3];
              if(!isW(W)||W==='N'||grid[u.id][d3]!=='OFF'||lock[over.id].has(d3)||lock[u.id].has(d3))continue;
              grid[over.id][dd]=X;grid[over.id][dd+1]=Y;grid[over.id][d3]='OFF';
              grid[u.id][dd]='N';grid[u.id][dd+1]='OFF';grid[u.id][d3]=W;
              if(okPerson(over)&&okPerson(u)){swapped=true;break;}
              grid[over.id][dd]='N';grid[over.id][dd+1]='OFF';grid[over.id][d3]=W;
              grid[u.id][dd]=X;grid[u.id][dd+1]=Y;grid[u.id][d3]='OFF';
            }
            if(swapped)break;
          }
        }
        if(!swapped)break;
      }
    }
    /* D·E·S(·N) 전체 불균형 = 각 근무의 (최대-최소) 합. 같은 날 두 사람 근무 맞바꿈/3자 순환 중
       불균형을 줄이는 것만 채택 → 일별 인원·OFF·연속 불변, 규칙(okPerson) 통과한 것만 */
    const codes=opts.nCap?['N','D','E','S']:['D','E','S'];
    const tally=()=>{const t={};for(const p of flex){t[p.id]={D:0,E:0,S:0,N:0};for(let dd=1;dd<=nd;dd++){const v=grid[p.id][dd];if(t[p.id][v]!==undefined)t[p.id][v]++;}}return t;};
    const imbalance=t=>{let s=0;for(const c of codes){let mn=1e9,mx=-1;for(const p of flex){mn=Math.min(mn,t[p.id][c]);mx=Math.max(mx,t[p.id][c]);if(capOf(c)&&t[p.id][c]>capOf(c))s+=2*(t[p.id][c]-capOf(c));}s+=mx-mn;}return s;};
    let cur=imbalance(tally()), guard=0;
    while(cur>codes.length&&guard++<400){ // 각 근무 격차 1 이하면 종료
      let improved=false;
      const t=tally();
      // 가장 격차 큰 근무의 최다/최소 보유자를 우선 후보로
      const worst=codes.slice().sort((a,b)=>{const sp=c=>{let mn=1e9,mx=-1,ex=0;for(const p of flex){mn=Math.min(mn,t[p.id][c]);mx=Math.max(mx,t[p.id][c]);if(CAPF(c)&&t[p.id][c]>CAPF(c))ex+=2*(t[p.id][c]-CAPF(c));}return mx-mn+ex;};return sp(b)-sp(a);})[0];
      const overs=flex.slice().sort((a,b)=>t[b.id][worst]-t[a.id][worst]);
      const unders=flex.slice().sort((a,b)=>t[a.id][worst]-t[b.id][worst]);
      const noPre=(p,dd)=>!lock[p.id].has(dd);
      const tryCommit=(ps)=>{ // 규칙 통과 + 불균형 감소면 채택
        if(ps.every(okPerson)){const nv=imbalance(tally());if(nv<cur){cur=nv;return true;}}
        return false;
      };
      outer:
      for(const over of overs)for(const u of unders){
        if(u===over)continue;
        for(let dd=1;dd<=nd;dd++){
          const oc=grid[over.id][dd],uc=grid[u.id][dd];
          if(oc!==worst||!noPre(over,dd)||!noPre(u,dd))continue;
          /* ① 같은 날 1:1 */
          if(isW(uc)&&uc!==oc&&!(oc==='N'&&preset[u.id].has(dd+1))&&!(uc==='N'&&preset[over.id].has(dd+1))){
            grid[over.id][dd]=uc;grid[u.id][dd]=oc;
            if(tryCommit([over,u])){improved=true;break outer;}
            grid[over.id][dd]=oc;grid[u.id][dd]=uc;
          }
          /* ② dd를 포함하는 날짜 블록(2~4일, 시작점 dd-2~dd) 통째 교환 — 인접 규칙(E뒤D 등)이 블록 안에서 그대로 유지됨, OFF 개수 불변일 때만 */
          for(const L of [2,3,4])for(let s0=dd-L+1;s0<=dd;s0++){
            if(s0<1||s0+L-1>nd)continue;
            let ok=true;const ov=[],uv=[];
            for(let k=0;k<L;k++){
              const a=grid[over.id][s0+k],b=grid[u.id][s0+k];
              if(!noPre(over,s0+k)||!noPre(u,s0+k)||!a||!b||a==='V'||b==='V'){ok=false;break;}
              ov.push(a);uv.push(b);
            }
            if(!ok)continue;
            const offEq=ov.filter(v=>v==='OFF').length===uv.filter(v=>v==='OFF').length;
            if(!offEq||ov.join()===uv.join())continue;
            for(let k=0;k<L;k++){grid[over.id][s0+k]=uv[k];grid[u.id][s0+k]=ov[k];}
            if(tryCommit([over,u])){improved=true;break outer;}
            for(let k=0;k<L;k++){grid[over.id][s0+k]=ov[k];grid[u.id][s0+k]=uv[k];}
          }
          /* ③ 3자 순환 (같은 날) */
          if(isW(uc)&&uc!==oc)for(const m of flex){
            if(m===over||m===u||!noPre(m,dd))continue;
            const mc=grid[m.id][dd];
            if(!isW(mc)||mc===oc||mc===uc)continue;
            if(mc==='N'&&preset[over.id].has(dd+1))continue;
            if(uc==='N'&&preset[m.id].has(dd+1))continue;
            grid[over.id][dd]=mc;grid[m.id][dd]=uc;grid[u.id][dd]=oc;
            if(tryCommit([over,m,u])){improved=true;break outer;}
            grid[over.id][dd]=oc;grid[m.id][dd]=mc;grid[u.id][dd]=uc;
          }
        }
      }
      if(!improved)break;
    }
  }
  /* N-OFF-근무 → N-OFF-OFF 수리: 두 사람이 서로 다른 두 날짜를 맞바꿈 (개인 OFF·일별 인원 불변, 규칙 통과만 채택) */
  if(opts.nAfterOff){
    let guard=0;
    while(guard++<80){
      let fixedOne=false;
      scan:
      for(const p of people){
        for(let v=3;v<=nd;v++){
          const X=grid[p.id][v];
          if(!isW(X)||X==='N'||grid[p.id][v-1]!=='OFF'||grid[p.id][v-2]!=='N'||lock[p.id].has(v))continue;
          /* p의 v일(근무 X)을 OFF로: q(그날 휴무)와 v일·t일 교차 교환 */
          for(const q of people){
            if(q===p||grid[q.id][v]!=='OFF'||lock[q.id].has(v))continue;
            if(grid[q.id][v-1]==='OFF'&&grid[q.id][v-2]==='N')continue; // q의 그날 휴무가 N-OFF-OFF의 둘째 OFF면 뺏지 않음
            if(q.fix&&q.fix!==X)continue;
            for(let t=1;t<=nd;t++){
              if(t===v||grid[p.id][t]!=='OFF'||lock[p.id].has(t))continue;
              if(grid[p.id][t-1]==='OFF'&&grid[p.id][t-2]==='N')continue; // p의 t일 휴무도 N-OFF-OFF 둘째 OFF면 유지
              const Y=grid[q.id][t];
              if(!isW(Y)||Y==='N'||lock[q.id].has(t))continue;
              if(p.fix&&p.fix!==Y)continue;
              grid[p.id][v]='OFF';grid[q.id][v]=X;
              grid[p.id][t]=Y;grid[q.id][t]='OFF';
              if(okPerson(p)&&okPerson(q)){fixedOne=true;break scan;}
              grid[p.id][v]=X;grid[q.id][v]='OFF';
              grid[p.id][t]='OFF';grid[q.id][t]=Y;
            }
          }
        }
      }
      if(!fixedOne)break;
    }
  }
  /* 결과 반영 (경계용 0·-1일 제외, 1~말일만 저장) */
  for(const p of people){
    if(!S.roster[opts.ym])S.roster[opts.ym]={};
    const clean={};
    for(let d=1;d<=nd;d++)if(grid[p.id][d])clean[d]=grid[p.id][d];
    S.roster[opts.ym][p.id]=clean;
  }
  return {shortage,extraS,surplus,capacity,need:baseNeed*nd,notes};
}

/* ===== 순환 편성: 패턴(예: ESDNFF)을 전원이 하루씩 어긋나게 그대로 반복 =====
   날짜 기준 절대 위상이라 달이 바뀌어도 주기가 자동으로 이어진다 */
function cyclicFill(opts){
  const [y,m]=ymParts(opts.ym), nd=daysIn(y,m);
  const people=unitStaff(opts.unitId);
  const n=people.length;
  if(!n)return {error:'이 유닛에 직원이 없습니다.'};
  const cyc=opts.pattern||'ESDNFF';
  const len=cyc.length;
  if(len<2||!cyc.includes('F'))return {error:'패턴에 근무와 F(휴무)가 같이 있어야 합니다. 예: E S D N F F'};
  const isWorkCode=v=>v==='D'||v==='E'||v==='S'||v==='N';
  const prevYm=shiftYm(opts.ym,-1);
  const prevRoster=S.roster[prevYm]||{};
  const [py,pm]=ymParts(prevYm), ndPrev=daysIn(py,pm);
  const notes=[];

  /* 지정 연차 수집 */
  const preset={};
  for(const p of people){
    const cur=(S.roster[opts.ym]||{})[p.id]||{};
    preset[p.id]=new Set(Object.keys(cur).filter(d=>cur[d]==='V').map(Number));
  }
  /* 1) 기본 순환 격자 */
  const epoch=d=>Math.floor(Date.UTC(y,m-1,d)/864e5);
  const grid={};
  people.forEach((p,i)=>{
    grid[p.id]={};
    for(let d=1;d<=nd;d++){
      const c=cyc[(((epoch(d)+i)%len)+len)%len];
      grid[p.id][d]=c==='F'?'OFF':c;
    }
    if(p.fix)for(let d=1;d<=nd;d++)if(grid[p.id][d]!=='OFF')grid[p.id][d]=p.fix; // 고정 근무 직원
  });
  /* 규칙 검사 헬퍼 (전월 경계 포함) */
  const val=(p,d)=> d>=1 ? (grid[p.id][d]||'') : ((prevRoster[p.id]||{})[ndPrev+d]||'');
  const runAround=(p,d)=>{ // d를 근무로 가정했을 때 연속 근무 길이
    let r=1;
    for(let k=d-1;k>=d-12;k--){if(isWorkCode(val(p,k)))r++;else break;}
    for(let k=d+1;k<=Math.min(nd,d+12);k++){if(isWorkCode(val(p,k)))r++;else break;}
    return r;
  };
  const nnC=opts.nAfterOff&&(opts.pattern||'').includes('NN'); // 패턴 N N
  const capC=c=>c==='N'?(opts.nCap||0):c==='D'?(opts.dCap||0):c==='E'?(opts.eCap||0):0;
  const CAPF=capC;
  const nAfterBad=(p,d,code)=>{ // N 다음 규칙 (N N 패턴이면 둘째 N까지 허용)
    if(opts.noNV&&code==='N'&&d<nd&&val(p,d+1)==='V')return true; // N 다음날 연차 금지
    if(!opts.nAfterOff)return false;
    if(val(p,d-1)==='N'&&!(nnC&&code==='N'&&val(p,d-2)!=='N'))return true;
    if(code==='N'&&d<nd){const nx=val(p,d+1);
      if(isWorkCode(nx)&&!(nnC&&nx==='N'&&val(p,d-1)!=='N'))return true;}
    return false;
  };
  const canWork=(p,d,code,skipRun)=>{
    if(nAfterBad(p,d,code))return false; // N 다음날은 OFF
    if(opts.noDafterNOFF&&code==='D'&&(val(p,d-1)==='OFF'||val(p,d-1)==='V')&&val(p,d-2)==='N')return false;
    if(opts.noED&&code==='D'&&val(p,d-1)==='E')return false; // E 다음날 D 금지
    if(opts.noED&&code==='E'&&d<nd&&val(p,d+1)==='D')return false; // 내일이 D인 사람에게 E 금지
    if((opts.custom||[]).length&&crBad(opts.custom,code,val(p,d-1),val(p,d-2),k=>val(p,d-k)))return false; // 사용자 규칙
    if(!skipRun&&opts.maxRun&&runAround(p,d)>opts.maxRun)return false;
    return true;
  };
  /* 2) 일별 개수 보정: 패턴이 어긋나더라도 D·E·N 개수는 무조건 기준대로 (남는 인력은 전부 S) */
  const canSwitch=(p,d,code)=>{ // 이미 근무 중인 사람의 근무 종류만 바꿀 때
    if(nAfterBad(p,d,code))return false; // N 다음날은 OFF (N N 패턴 반영)
    if(opts.noED&&code==='D'&&val(p,d-1)==='E')return false; // E 다음날 D 금지
    if(opts.noED&&code==='E'&&d<nd&&val(p,d+1)==='D')return false; // 내일이 D인 사람에게 E 금지
    if(opts.noDafterNOFF&&code==='D'&&(val(p,d-1)==='OFF'||val(p,d-1)==='V')&&val(p,d-2)==='N')return false; // N,OFF 다음 D 금지
    if((opts.custom||[]).length&&crBad(opts.custom,code,val(p,d-1),val(p,d-2),k=>val(p,d-k)))return false; // 사용자 규칙
    return true;
  };
  for(let d=1;d<=nd;d++){
    for(const code of ['D','E','N']){ // 초과분 먼저 S로 내려서 풀 확보
      const need=opts.need[code]||0;
      let have=people.filter(p=>grid[p.id][d]===code).length;
      while(have>need){
        const cand=people.filter(p=>grid[p.id][d]===code&&!p.fix&&!preset[p.id].has(d)&&!(nnC&&val(p,d-1)==='N')); // 둘째 N은 내리면 N 다음 S가 됨
        if(!cand.length)break;
        cand.sort((a,b)=>Object.values(grid[b.id]).filter(v=>v===code).length-Object.values(grid[a.id]).filter(v=>v===code).length);
        grid[cand[0].id][d]='S';have--;
      }
    }
    for(const code of ['N','D','E']){ // 부족분은 S에서 끌어옴 (제약 많은 N부터)
      const need=opts.need[code]||0;
      let have=people.filter(p=>grid[p.id][d]===code).length;
      while(have<need){
        let pool=people.filter(p=>grid[p.id][d]==='S'&&!p.fix&&!preset[p.id].has(d)&&canSwitch(p,d,code));
        if(code==='N'){
          const nv=pool.filter(p=>!preset[p.id].has(d+1)); // N 다음날 연차 금지
          if(nv.length)pool=nv;
        }
        if(pool.length){
          const cnt=(p,c)=>Object.values(grid[p.id]).filter(v=>v===c).length;
          pool.sort((a,b)=>
            (capC(code)?(cnt(a,code)>=capC(code)?1:0)-(cnt(b,code)>=capC(code)?1:0):0) // 1인당 기본 개수 채운 사람 후순위
            ||cnt(a,code)-cnt(b,code));
          grid[pool[0].id][d]=code;have++;continue;
        }
        /* S에서 직접 못 끌어오면(주로 N): 근무자와 역할을 바꾸고 그 자리를 S가 메꿈 — N 개수 균형 유지 */
        let done=false;
        const nCnt=p=>Object.values(grid[p.id]).filter(v=>v==='N').length;
        const ws=people.filter(w=>{const wc0=grid[w.id][d];return isWorkCode(wc0)&&wc0!==code&&!w.fix&&!preset[w.id].has(d)&&canSwitch(w,d,code);})
          .sort((a,b)=>{
            if(code==='N')return nCnt(a)-nCnt(b); // N을 받을 사람: N 적은 사람부터
            const an=grid[a.id][d]==='N'?nCnt(a):-1, bn=grid[b.id][d]==='N'?nCnt(b):-1;
            return bn-an; // N을 내놓을 사람: N 많은 사람부터
          });
        outer:
        for(const w of ws){
          const wc=grid[w.id][d];
          const qs=people.filter(q=>q!==w&&grid[q.id][d]==='S'&&!q.fix&&!preset[q.id].has(d)&&canSwitch(q,d,wc))
            .sort((a,b)=>wc==='N'?nCnt(a)-nCnt(b):0); // N을 받는 S 인원도 N 적은 사람부터
          for(const q of qs){
            grid[w.id][d]=code;grid[q.id][d]=wc;done=true;break outer;
          }
        }
        if(!done)break; // 최종 부족은 아래 shortage에서 보고
        have++;
      }
    }
  }
  /* 3) 지정 연차: 휴무일이면 그대로 연차, 근무일이면 그날 OFF인 사람과 맞바꿈 */
  for(const p of people){
    for(const d of [...preset[p.id]].sort((a,b)=>a-b)){
      if(d<1||d>nd)continue;
      const orig=grid[p.id][d];
      grid[p.id][d]='V';
      if(orig==='OFF'||orig==='V')continue;
      const sub=people.filter(q=>q!==p&&grid[q.id][d]==='OFF'&&!preset[q.id].has(d)&&canWork(q,d,orig))
        .sort((a,b)=>{ // OFF가 많이 남을 사람부터 대신 서게
          const rest=x=>Object.values(grid[x.id]).filter(v=>v==='OFF').length;
          return rest(b)-rest(a);
        })[0];
      if(sub){grid[sub.id][d]=orig;continue;}
      /* 직접 대체가 안 되면: 그날 근무자와 역할을 바꾸고, 그 사람의 원래 근무를 휴무자가 메꿈 */
      let done=false;
      outer:
      for(const w of people){
        if(w===p||preset[w.id].has(d))continue;
        const wc=grid[w.id][d];
        if(!isWorkCode(wc)||wc===orig)continue;
        if(!canWork(w,d,orig,true))continue; // w는 이미 근무 중이라 연속일수 불변
        for(const q of people){
          if(q===p||q===w||grid[q.id][d]!=='OFF'||preset[q.id].has(d))continue;
          if(!canWork(q,d,wc))continue;
          grid[w.id][d]=orig;grid[q.id][d]=wc;done=true;break outer;
        }
      }
      if(!done)notes.push(`${d}일: ${esc(p.name)} 연차 자리(${orig})를 규칙(야간·연속제한) 안에서 대신할 사람이 없습니다 — 그날은 손으로 조정해 주세요`);
    }
  }
  /* 4) OFF 초과분을 S로 전환해 오프수 맞춤 (기준표의 "S 2명인 날") */
  let extraS=0;
  for(const p of people){
    const offDays=()=>Object.keys(grid[p.id]).map(Number).filter(d=>grid[p.id][d]==='OFF');
    let excess=offDays().length-opts.off;
    if(excess<0){notes.push(`${esc(p.name)}: OFF ${offDays().length}개 (목표 ${opts.off}개보다 적음)`);continue;}
    while(excess>0){
      const sCount=d=>people.filter(q=>grid[q.id][d]==='S').length;
      const cand=offDays().filter(d=>canWork(p,d,'S'))
        .sort((a,b)=>sCount(a)-sCount(b)||a-b)[0]; // S가 적은 날부터 고르게
      if(cand===undefined){notes.push(`${esc(p.name)}: 규칙 때문에 OFF ${excess}개를 근무로 못 바꿨습니다`);break;}
      grid[p.id][cand]='S';extraS++;excess--;
    }
  }
  /* 근무 개수 균형(N→D→E→S 순): 같은 날 근무끼리 맞바꿈 (일별 인원·OFF·연속 불변) */
  {
    const cnt=(p,c)=>{let k=0;for(let dd=1;dd<=nd;dd++)if(grid[p.id][dd]===c)k++;return k;};
    const flex=people.filter(p=>!p.fix);
    /* 전체 불균형(각 근무의 최대-최소 합)을 줄이는 같은 날 맞바꿈/3자 순환만 채택 */
    const codes=opts.nCap?['N','D','E','S']:['D','E','S'];
    const tally=()=>{const t={};for(const p of flex){t[p.id]={D:0,E:0,S:0,N:0};for(let dd=1;dd<=nd;dd++){const v=grid[p.id][dd];if(t[p.id][v]!==undefined)t[p.id][v]++;}}return t;};
    const imbalance=t=>{let s=0;for(const c of codes){let mn=1e9,mx=-1;for(const p of flex){mn=Math.min(mn,t[p.id][c]);mx=Math.max(mx,t[p.id][c]);if(capC(c)&&t[p.id][c]>capC(c))s+=2*(t[p.id][c]-capC(c));}s+=mx-mn;}return s;};
    let cur=imbalance(tally()), guard=0;
    while(flex.length&&cur>codes.length&&guard++<400){
      let improved=false;
      const t=tally();
      const worst=codes.slice().sort((a,b)=>{const sp=c=>{let mn=1e9,mx=-1,ex=0;for(const p of flex){mn=Math.min(mn,t[p.id][c]);mx=Math.max(mx,t[p.id][c]);if(CAPF(c)&&t[p.id][c]>CAPF(c))ex+=2*(t[p.id][c]-CAPF(c));}return mx-mn+ex;};return sp(b)-sp(a);})[0];
      const overs=flex.slice().sort((a,b)=>t[b.id][worst]-t[a.id][worst]);
      const unders=flex.slice().sort((a,b)=>t[a.id][worst]-t[b.id][worst]);
      /* 규칙 검사(경계 포함): 한 사람 전체 */
      const okAll=p=>{
        for(let dd=1;dd<=nd;dd++){const v=grid[p.id][dd];if(!isWorkCode(v))continue;if(!canWork(p,dd,v,true))return false;}
        let run=0;for(let k=0;k>-12;k--){if(isWorkCode(val(p,k)))run++;else break;}
        let orun=0;for(let k=0;k>-12;k--){if(val(p,k)==='OFF')orun++;else break;}
        for(let dd=1;dd<=nd;dd++){const v=grid[p.id][dd];
          if(isWorkCode(v)){run++;if(opts.maxRun&&run>opts.maxRun)return false;}else run=0;
          if(v==='OFF'){orun++;if(orun>(opts.offMax||2))return false;}else orun=0;}
        return true;
      };
      outer:
      for(const over of overs)for(const u of unders){
        if(u===over)continue;
        for(let dd=1;dd<=nd;dd++){
          const oc=grid[over.id][dd],uc=grid[u.id][dd];
          if(oc!==worst||preset[over.id].has(dd)||preset[u.id].has(dd))continue;
          if(isWorkCode(uc)&&uc!==oc&&canSwitch(u,dd,oc)&&canSwitch(over,dd,uc)){
            grid[over.id][dd]=uc;grid[u.id][dd]=oc;
            const nv=imbalance(tally());
            if(nv<cur){cur=nv;improved=true;break outer;}
            grid[over.id][dd]=oc;grid[u.id][dd]=uc;
          }
          /* dd를 포함하는 날짜 블록(2~4일, 시작점 dd-2~dd) 통째 교환 (OFF 개수 불변일 때) */
          for(const L of [2,3,4])for(let s0=dd-L+1;s0<=dd;s0++){
            if(s0<1||s0+L-1>nd)continue;
            let ok=true;const ov=[],uv=[];
            for(let k=0;k<L;k++){
              const a=grid[over.id][s0+k],b=grid[u.id][s0+k];
              if(preset[over.id].has(s0+k)||preset[u.id].has(s0+k)||!a||!b||a==='V'||b==='V'){ok=false;break;}
              ov.push(a);uv.push(b);
            }
            if(!ok)continue;
            if(ov.filter(v=>v==='OFF').length!==uv.filter(v=>v==='OFF').length||ov.join()===uv.join())continue;
            for(let k=0;k<L;k++){grid[over.id][s0+k]=uv[k];grid[u.id][s0+k]=ov[k];}
            if(okAll(over)&&okAll(u)){const nv=imbalance(tally());if(nv<cur){cur=nv;improved=true;break outer;}}
            for(let k=0;k<L;k++){grid[over.id][s0+k]=ov[k];grid[u.id][s0+k]=uv[k];}
          }
          if(!isWorkCode(uc)||uc===oc)continue;
          for(const m of flex){
            if(m===over||m===u||preset[m.id].has(dd))continue;
            const mc=grid[m.id][dd];
            if(!isWorkCode(mc)||mc===oc||mc===uc)continue;
            if(canSwitch(over,dd,mc)&&canSwitch(m,dd,uc)&&canSwitch(u,dd,oc)){
              grid[over.id][dd]=mc;grid[m.id][dd]=uc;grid[u.id][dd]=oc;
              const nv=imbalance(tally());
              if(nv<cur){cur=nv;improved=true;break outer;}
              grid[over.id][dd]=oc;grid[m.id][dd]=mc;grid[u.id][dd]=uc;
            }
          }
        }
      }
      if(!improved)break;
    }
  }
  /* 결과 저장 + 요약 */
  for(const p of people){
    if(!S.roster[opts.ym])S.roster[opts.ym]={};
    const clean={};
    for(let d=1;d<=nd;d++)if(grid[p.id][d])clean[d]=grid[p.id][d];
    S.roster[opts.ym][p.id]=clean;
  }
  const shortage={};
  for(let d=1;d<=nd;d++){
    for(const c of ['D','E','S','N']){
      const have=people.filter(p=>grid[p.id][d]===c).length, need=opts.need[c]||0;
      if(have<need){shortage[d]=shortage[d]||[];shortage[d].push(c+' '+(need-have)+'명');}
    }
  }
  const baseNeed=['D','E','S','N'].reduce((a,c)=>a+(opts.need[c]||0),0);
  let customViol=0; // 규칙 위반 수 (있으면 개수우선 방식으로 대체)
  for(const p of people)for(let d=1;d<=nd;d++){
    const v=grid[p.id][d]||'';
    if(!v)continue;
    if((opts.custom||[]).length&&crBad(opts.custom,v,val(p,d-1),val(p,d-2),k=>val(p,d-k)))customViol++;
    if(opts.noNV&&v==='V'&&val(p,d-1)==='N')customViol++; // N 다음날 연차 금지
  }
  let offBad=0; // OFF 개수가 목표와 다른 사람 수 (개수 최우선 판단용)
  for(const p of people){
    const o=Object.values(grid[p.id]).filter(v=>v==='OFF').length;
    if(o!==opts.off)offBad++;
  }
  return {shortage,extraS,notes,offBad,customViol,cycle:cyc,capacity:n*nd-people.reduce((a,p)=>a+Object.values(grid[p.id]).filter(v=>v==='OFF'||v==='V').length,0),need:baseNeed*nd,surplus:0};
}

/* ===== 규칙 검사기: 근무표 한 달을 모든 규칙으로 검사 (화면 경고·편성 결과·우선순위 비교 공용) =====
   반환: byId[규칙id] = [{pid,day,msg,w}], cells['pid|day']=true(빨간 테두리), score[규칙id]=위반 수 */
function checkRoster(ym,unitId){
  const rc=RC(unitId), unit=unitById(unitId), people=unitStaff(unitId);
  const [y,m]=ymParts(ym), nd=daysIn(y,m);
  const prevYm=shiftYm(ym,-1),[ppy,ppm]=ymParts(prevYm),ndPrev=daysIn(ppy,ppm);
  const cellRel=(pid,day)=> day>=1 ? getCell(ym,pid,day) : getCell(prevYm,pid,ndPrev+day);
  const isW=x=>x==='D'||x==='E'||x==='S'||x==='N';
  const offTarget=(S.offs[String(y)]||[])[m-1];
  const pat=rc.pattern||'', nn=rc.nAfterOff&&pat.includes('NN');
  const predOf={};
  if(pat.length>=2)for(let i=0;i<pat.length;i++)(predOf[pat[i]]=predOf[pat[i]]||new Set()).add(pat[(i-1+pat.length)%pat.length]);
  const custom=activeRules(rc);
  const byId={},cells={},score={};
  const add=(id,p,day,msg,w=1,mark=true)=>{(byId[id]=byId[id]||[]).push({pid:p&&p.id,day,msg,w});score[id]=(score[id]||0)+w;if(mark&&p&&day)cells[p.id+'|'+day]=true;};
  const pinO=(S.pinOff||{})[ym]||{}, pinS=(S.pinShift||{})[ym]||{};
  for(const p of people){
    const cnt={D:0,E:0,S:0,N:0,OFF:0,V:0};
    let run=0,orun=0;
    for(let k=0;k<12;k++){if(isW(cellRel(p.id,-k)))run++;else break;}
    for(let k=0;k<12;k++){if(cellRel(p.id,-k)==='OFF')orun++;else break;}
    for(let d=1;d<=nd;d++){
      const v=getCell(ym,p.id,d), prev=cellRel(p.id,d-1), prev2=cellRel(p.id,d-2);
      if(v)cnt[v]++;
      if(rc.nAfterOff&&prev==='N'&&isW(v)&&!(nn&&v==='N'&&prev2!=='N'))add('r:nAfterOff',p,d,`${p.name} ${d}일 (N 다음 ${v})`);
      if(rc.noNV&&prev==='N'&&v==='V')add('r:noNV',p,d,`${p.name} ${d}일`);
      if(rc.noED&&prev==='E'&&v==='D')add('r:noED',p,d,`${p.name} ${d}일`);
      if(rc.noDafterNOFF&&v==='D'&&(prev==='OFF'||prev==='V')&&prev2==='N')add('r:noDafterNOFF',p,d,`${p.name} ${d}일`);
      if(v&&custom.length){const cr=crBad(custom,v,prev,prev2,k=>cellRel(p.id,d-k));if(cr)add('c:'+cr.id,p,d,`${p.name} ${d}일`);}
      run=isW(v)?run+1:0;
      if(rc.maxRun>0&&run>rc.maxRun)add('mxw',p,d,`${p.name} ${d}일 (${run}일째)`,1);
      orun=v==='OFF'?orun+1:0;
      const om=rc.offMax||2;
      if(orun>om)add('mxo',p,d,`${p.name} ${d}일 (OFF ${orun}일째)`);
      if(!p.fix&&isW(v)&&predOf[v]&&prev){const pr=predOf[v];if(!((pr.has('F')&&(prev==='OFF'||prev==='V'))||pr.has(prev)))add('pat',p,d,'',1,false);}
      if((pinO[p.id]||[]).includes(d)&&v!=='OFF')add('pin',p,d,`${p.name} ${d}일 (OFF로 정했는데 ${v||'빈칸'})`);
      const ps=(pinS[p.id]||{})[d];
      if(ps&&v!==ps)add('pin',p,d,`${p.name} ${d}일 (${ps}로 정했는데 ${v||'빈칸'})`);
    }
    if(offTarget!==undefined&&cnt.OFF!==offTarget)add('off',p,0,`${p.name} ${cnt.OFF}개 (목표 ${offTarget}개)`,Math.abs(cnt.OFF-offTarget));
    if(!p.fix){
      if(rc.nCap&&cnt.N>rc.nCap)add('capN',p,0,`${p.name} ${cnt.N}개 (기본 ${rc.nCap}개)`,cnt.N-rc.nCap);
      if(rc.dCap&&cnt.D>rc.dCap)add('capDE',p,0,`${p.name} D ${cnt.D}개 (기본 ${rc.dCap}개)`,cnt.D-rc.dCap);
      if(rc.eCap&&cnt.E>rc.eCap)add('capDE',p,0,`${p.name} E ${cnt.E}개 (기본 ${rc.eCap}개)`,cnt.E-rc.eCap);
    }
  }
  if(unit)for(let d=1;d<=nd;d++)for(const c of ['E','D','N']){
    const need=unit.need[c]||0;let have=0;
    for(const p of people)if(getCell(ym,p.id,d)===c)have++;
    if(have<need)add('need',null,d,`${d}일 ${c} ${need-have}명 부족`,need-have,false);
  }
  return {byId,cells,score};
}
/* 우선순위대로 편성: 모든 규칙으로 먼저 짜보고, 못 지킨 게 있으면 빨간 선 아래 규칙을 아래쪽부터 하나씩 양보하며 다시 짠다.
   결과들은 "위쪽 규칙 위반이 적은 것"이 이기는 방식(순위 순서대로 비교)으로 고른다 */
const DROPPABLE=id=>id.startsWith('r:')||id.startsWith('c:')||['mxw','mxo','capN','capDE','pat'].includes(id);
function priorityFill(ym,unitId,offTarget){
  const rc=RC(unitId), unit=unitById(unitId), people=unitStaff(unitId);
  const prio=prioOf(rc), info=ruleInfo(rc,unit);
  const order=prio.filter(x=>x!=='LINE'&&info[x]&&info[x].on);
  const li=prio.indexOf('LINE');
  const soft=prio.slice(li+1).filter(x=>info[x]&&info[x].on&&DROPPABLE(x)).reverse(); // 아래쪽부터
  if(!S.roster[ym])S.roster[ym]={};
  const snap=()=>{const o={};for(const p of people)o[p.id]=structuredClone(S.roster[ym][p.id]||{});return o;};
  const restore=o=>{for(const p of people)S.roster[ym][p.id]=structuredClone(o[p.id]);};
  const orig=snap();
  const hasPins=people.some(p=>(((S.pinOff||{})[ym]||{})[p.id]||[]).length||Object.keys(((S.pinShift||{})[ym]||{})[p.id]||{}).length);
  const less=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i];}return false;};
  const clean=v=>order.every((id,i)=>id==='pat'||v[i]===0);
  let best=null,err=null;
  const tryRun=drop=>{
    const o={ym,unitId,need:{D:unit.need.D||0,E:unit.need.E||0,S:0,N:unit.need.N||0},off:offTarget,
      nAfterOff:!!rc.nAfterOff&&!drop.has('r:nAfterOff'),
      noNV:!!rc.noNV&&!drop.has('r:noNV'),
      noED:!!rc.noED&&!drop.has('r:noED'),
      noDafterNOFF:!!rc.noDafterNOFF&&!drop.has('r:noDafterNOFF'),
      maxRun:drop.has('mxw')?0:(rc.maxRun||0),
      offMax:drop.has('mxo')?31:(rc.offMax||2),
      nCap:drop.has('capN')?0:(rc.nCap||0),
      dCap:drop.has('capDE')?0:(rc.dCap||0),
      eCap:drop.has('capDE')?0:(rc.eCap||0),
      pattern:rc.pattern||'',
      custom:activeRules(rc).filter(r=>!drop.has('c:'+r.id))};
    const modes=(rc.mode!=='greedy'&&!hasPins&&!drop.has('pat'))?['cycle','greedy']:['greedy'];
    for(const md of modes){
      restore(orig);
      const res=md==='cycle'?cyclicFill(o):autoFill(o);
      if(res.error){err=res;return;}
      const chk=checkRoster(ym,unitId);
      const vec=order.map(id=>chk.score[id]||0);
      if(!best||less(vec,best.vec))best={res,vec,grid:snap(),drop:[...drop],mode:md};
      if(md==='cycle'&&clean(vec))break; // 순환이 다 지켰으면 자동 방식은 안 돌려봄
    }
  };
  tryRun(new Set());
  for(let k=1;!err&&k<=soft.length&&!clean(best.vec);k++)tryRun(new Set(soft.slice(0,k)));
  if(err&&!best){restore(orig);return err;}
  restore(best.grid);
  /* 마무리 수리: 규칙에 걸린 칸마다 두 사람이 두 날짜를 맞바꿔 보고(일별 인원·각자 OFF 개수 그대로), 우선순위로 더 나아지면 채택 */
  {
    const t0=performance.now();
    const lockOf=p=>{const s=new Set(((S.pinOff[ym]||{})[p.id]||[]));for(const d in ((S.pinShift[ym]||{})[p.id]||{}))s.add(+d);return s;};
    const locks={};for(const p of people)locks[p.id]=lockOf(p);
    const nd=daysIn(...ymParts(ym));
    const vecNow=()=>{const c=checkRoster(ym,unitId);return {c,v:order.map(id=>c.score[id]||0)};};
    const isWk=v=>v==='D'||v==='E'||v==='S'||v==='N';
    let cur=vecNow(),rounds=0;
    while(rounds++<40&&performance.now()-t0<2500){
      const targets=[];
      for(const id of order){if(id==='pat'||id==='need'||id==='off')continue;for(const x of (cur.c.byId[id]||[]))if(x.pid&&x.day)targets.push(x);}
      if(!targets.length)break;
      let improved=false;
      tg:
      for(const x of targets){
        const p=people.find(q=>q.id===x.pid);
        for(let dd=Math.max(1,x.day-(RC(unitId).maxRun||4));dd<=x.day;dd++){
          const g=S.roster[ym];
          const a=g[p.id][dd];
          if(locks[p.id].has(dd)||a==='V')continue;
          for(const q of people){
            if(q===p)continue;
            const b=g[q.id][dd];
            if(locks[q.id].has(dd)||b==='V'||a===b)continue;
            if(!((isWk(a)&&b==='OFF')||(a==='OFF'&&isWk(b))))continue;
            if((q.fix&&isWk(a)&&q.fix!==a)||(p.fix&&isWk(b)&&p.fix!==b))continue;
            for(let d2=1;d2<=nd;d2++){
              if(d2===dd||locks[p.id].has(d2)||locks[q.id].has(d2))continue;
              const c2=g[p.id][d2],e2=g[q.id][d2];
              if(isWk(a)?!(c2==='OFF'&&isWk(e2)):!(isWk(c2)&&e2==='OFF'))continue; // d2에는 반대로 (p·q 각자 OFF 개수 그대로)
              if((p.fix&&isWk(e2)&&p.fix!==e2)||(q.fix&&isWk(c2)&&q.fix!==c2))continue;
              g[p.id][dd]=b;g[q.id][dd]=a;g[p.id][d2]=e2;g[q.id][d2]=c2;
              const nv=vecNow();
              if(less(nv.v,cur.v)){cur=nv;improved=true;break tg;}
              g[p.id][dd]=a;g[q.id][dd]=b;g[p.id][d2]=c2;g[q.id][d2]=e2;
            }
          }
        }
      }
      if(!improved)break;
    }
    best.vec=cur.v;
  }
  const r=best.res;
  r.notes=r.notes||[];
  if(rc.mode!=='greedy'&&hasPins)r.notes.unshift('미리 정한 날이 있어 개수 우선 방식으로 편성했습니다');
  else if(rc.mode!=='greedy'&&best.mode==='greedy')r.notes.unshift('패턴 그대로는 규칙·개수를 다 못 맞추는 달이라, 개수를 우선으로 하고 패턴은 최대한 따르는 방식으로 편성했습니다');
  const conceded=best.drop.filter(id=>id!=='pat'&&best.vec[order.indexOf(id)]>0);
  if(conceded.length)r.notes.unshift('규칙끼리 부딪혀 아래쪽 규칙을 양보했습니다: '+conceded.map(id=>info[id].nm).join(', '));
  r.cycle=best.mode==='cycle'?(rc.pattern||''):null;
  if(best.mode!=='cycle'){r.shortage=r.shortage||{};}
  return r;
}

/* 미리 정하기 글칸: "5=연, 12-14=OFF, 20=N" ↔ 연차(근무표 V)·OFF 고정(pinOff)·근무 지정(pinShift) */
const PIN_CODE={'연':'V','연차':'V','V':'V','휴':'V','OFF':'OFF','O':'OFF','F':'OFF','오프':'OFF','D':'D','E':'E','S':'S','N':'N'};
function parsePins(str,nd){
  const out={},bad=[];
  for(const tok0 of String(str||'').split(/[,，\s]+/)){
    const tok=tok0.trim();if(!tok)continue;
    const mm=tok.match(/^(\d+)(?:\s*[-~]\s*(\d+))?\s*=?\s*([A-Za-z가-힣]+)$/);
    const code=mm&&PIN_CODE[mm[3].toUpperCase()]||mm&&PIN_CODE[mm[3]];
    if(!mm||!code){bad.push(tok);continue;}
    const a=+mm[1],b=mm[2]?+mm[2]:a;
    for(let d=a;d<=Math.min(b,nd);d++)if(d>=1)out[d]=code;
  }
  return {pins:out,bad};
}
function pinsText(ym,pid){
  const cur=(S.roster[ym]||{})[pid]||{};
  const all={};
  for(const d of Object.keys(cur))if(cur[d]==='V')all[+d]='연';
  for(const d of (((S.pinOff||{})[ym]||{})[pid]||[]))all[+d]='OFF';
  const ps=((S.pinShift||{})[ym]||{})[pid]||{};
  for(const d of Object.keys(ps))all[+d]=ps[d];
  const days=Object.keys(all).map(Number).sort((a,b)=>a-b),parts=[];
  for(let i=0;i<days.length;){
    let j=i;while(j+1<days.length&&days[j+1]===days[j]+1&&all[days[j+1]]===all[days[i]])j++;
    parts.push((j>i?days[i]+'-'+days[j]:days[i])+'='+all[days[i]]);i=j+1;
  }
  return parts.join(', ');
}
function applyPins(ym,pid,pins){
  if(!S.pinOff[ym])S.pinOff[ym]={};
  if(!S.pinShift[ym])S.pinShift[ym]={};
  const cur=(S.roster[ym]||{})[pid]||{};
  for(const d of Object.keys(cur))if(cur[d]==='V'&&pins[d]!=='V')setCell(ym,pid,+d,'');
  const off=[],sh={};
  for(const d in pins){
    const c=pins[d];
    if(c==='V')setCell(ym,pid,+d,'V');
    else if(c==='OFF')off.push(+d);
    else sh[d]=c;
  }
  if(off.length)S.pinOff[ym][pid]=off.sort((a,b)=>a-b);else delete S.pinOff[ym][pid];
  if(Object.keys(sh).length)S.pinShift[ym][pid]=sh;else delete S.pinShift[ym][pid];
}
